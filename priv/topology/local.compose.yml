#
# docker-compose for the :local XMPP-bench topology. See
# PLAN/MONGOOSEIM_BENCH_PLAN.md.
#
# Five services on one bridge network:
#   mongooseim-1/2/3 — three pinned MongooseIM brokers forming a
#                   CETS cluster via shared Postgres discovery
#                   (see internal_databases.cets in the prod-vars
#                   config). Matches the :aws_clt 3-broker shape so
#                   we can validate clustering, session-replication,
#                   and load-distribution locally before spending on
#                   AWS bare-metal. mongooseim-1 publishes 5222 to
#                   the host for outside-Docker reach; -2 and -3 are
#                   reached only via the bridge (amoc-worker shards).
#   amoc-master   — pinned amoc-arsenal-xmpp, REST API on port 4000.
#                   Coordinates the cluster but doesn't run scenarios.
#   amoc-worker   — pinned amoc-arsenal-xmpp, joins the master via
#                   AMOC_NODES and is the node that actually spawns
#                   users + drives traffic. AMOC_XMPP_SERVERS lists
#                   all 3 brokers so amoc_xmpp:pick_server/1 shards
#                   users across them by phash2. The :aws_clt
#                   topology scales workers + brokers horizontally;
#                   on :local one worker is plenty for the ~1k user
#                   smoke shape (see priv/scenario-config/*.local.json).
#
# Build args, USERS / DOMAINS / INTERARRIVAL_MS and the pin SHAs are
# passed in from the orchestrator's environment. Defaults match the
# Phase 1 :local-shape scenario config (1k users / 10 domains /
# 5ms interarrival).
#
# Used by `Awfy.Xmpp.Topology` (lib/awfy/xmpp/topology.ex) which
# shells out to `docker compose -f <this file> ...` for lifecycle.
# Mirrors upstream amoc-arsenal-xmpp's ci/docker-compose.yml so a
# pin uplift translates one-to-one.

# Force the project name so the amoc-master service's built image
# resolves to a known tag (`awfy_xmpp-amoc-master:latest`) regardless
# of the caller's working directory. Without this, compose defaults
# to the basename of the working dir — locally that happens to give
# us the same name we hardcoded for amoc-worker's `image:`, but in
# CI the working dir is the repo root (`awfy`) so the auto-tag
# becomes `awfy-amoc-master` and amoc-worker's `image: ...-amoc-master`
# + `pull_policy: never` fails fast with "no such image".
name: awfy_xmpp

services:
  postgres:
    container_name: awfy-postgres
    # Pinned to one PG major to match what the :aws_clt topology will
    # provision via RDS. The :aws_clt path pins to the same major so a
    # schema rev that breaks here breaks there too.
    image: postgres:15
    environment:
      POSTGRES_DB: mongooseim
      POSTGRES_USER: mongooseim
      POSTGRES_PASSWORD: mongooseim_secret
    volumes:
      # Postgres runs anything in /docker-entrypoint-initdb.d/ on first
      # boot (volumes are tmpfs in the compose lifecycle below, so
      # "first boot" is every `up`). The schema file is the canonical
      # MongooseIM 6.6.0 PG schema, fetched from upstream.
      - ./mongooseim-6.6.0-pg.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mongooseim", "-d", "mongooseim"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Shared build for all 3 broker services. compose builds it once
  # (from mongooseim-1) and the other two pull the resulting image
  # tag — same pattern as amoc-master/amoc-worker below.
  mongooseim-1:
    container_name: awfy-mongooseim-1
    hostname: mongooseim-1
    build:
      context: ../..
      dockerfile: Dockerfile.mongoose
      args:
        MIM_PIN: "${MIM_PIN:-6.6.0}"
        # MIM_OTP_VERSION (broker side) is the axis we sweep across in
        # CI — `bench.yml`'s measure-xmpp-linux job sets it to each
        # target OTP. Amoc is pinned on a separate AMOC_OTP_VERSION
        # var so the load-gen stays constant across the sweep.
        OTP_VERSION: "${MIM_OTP_VERSION:-27.3}"
        # MIM_BASE_IMAGE / MIM_RUNTIME_IMAGE swap the FROM lines in
        # Dockerfile.mongoose. Default Docker Hub `erlang:<tag>`
        # (good for local dev + numeric stable OTPs); CI overrides
        # to the per-OTP AWFY image (`ghcr.io/<repo>:<sha>-<arch>`)
        # so master / maint-XX / RCs — which have no Docker Hub tag
        # — can still be measured.
        BASE_IMAGE: "${MIM_BASE_IMAGE:-erlang:${MIM_OTP_VERSION:-27.3}}"
        RUNTIME_IMAGE: "${MIM_RUNTIME_IMAGE:-erlang:${MIM_OTP_VERSION:-27.3}-slim}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5222:5222"
    environment:
      # ERL_FLAGS provides the three things vm.args used to carry
      # statically: the node's distribution name (-sname …), the
      # shared cluster cookie (-setcookie …), and the optional
      # jit/emu flavor switch forwarded from the orchestrator. The
      # Dockerfile sed-strips -sname/-setcookie out of vm.args so
      # this is the sole source of identity — last-wins parsing
      # isn't worth relying on across OTP versions. Cookie matches
      # mongooseim-2 / -3 so all three nodes can speak distribution.
      ERL_FLAGS: "-sname mongooseim@mongooseim-1 -setcookie awfy_xmpp_cluster ${MIM_ERL_FLAGS:-}"
    healthcheck:
      # `mongooseimctl status` exits 0 only when the BEAM is up and
      # the boot-time apps have finished starting. ~30s of retries
      # covers a cold start on first-build.
      test: ["CMD", "./bin/mongooseimctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongooseim-2:
    container_name: awfy-mongooseim-2
    hostname: mongooseim-2
    # Reuse the image mongooseim-1 just built (compose tags it as
    # `<project>-<service>:latest` = `awfy_xmpp-mongooseim-1`). All
    # three brokers run identical code; the only per-container
    # difference is the -sname in ERL_FLAGS below, which CETS uses
    # to register this node in the shared discovery table.
    image: awfy_xmpp-mongooseim-1
    pull_policy: never
    depends_on:
      mongooseim-1:
        condition: service_healthy
    environment:
      ERL_FLAGS: "-sname mongooseim@mongooseim-2 -setcookie awfy_xmpp_cluster ${MIM_ERL_FLAGS:-}"
    healthcheck:
      test: ["CMD", "./bin/mongooseimctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongooseim-3:
    container_name: awfy-mongooseim-3
    hostname: mongooseim-3
    image: awfy_xmpp-mongooseim-1
    pull_policy: never
    depends_on:
      mongooseim-1:
        condition: service_healthy
    environment:
      ERL_FLAGS: "-sname mongooseim@mongooseim-3 -setcookie awfy_xmpp_cluster ${MIM_ERL_FLAGS:-}"
    healthcheck:
      test: ["CMD", "./bin/mongooseimctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  amoc-master:
    container_name: awfy-amoc-master
    hostname: amoc-master
    build:
      context: ../..
      dockerfile: Dockerfile.amoc
      args:
        AMOC_ARSENAL_PIN: "${AMOC_ARSENAL_PIN:-eac44cfe79417a96e87a6629916d2c49102da0e4}"
        # AMOC_OTP_VERSION is the load-gen's OTP — separate from
        # MIM_OTP_VERSION (the broker axis we sweep). Stays pinned
        # via priv/amoc-otp-version.txt; refreshed yearly when we
        # uplift MongooseIM + Amoc together.
        OTP_VERSION: "${AMOC_OTP_VERSION:-27.3}"
    depends_on:
      # amoc-master only needs ONE broker reachable to declare
      # itself ready — CETS will replicate session state across the
      # other two as they boot. Use mongooseim-1 (the build leader)
      # since it's guaranteed up first.
      mongooseim-1:
        condition: service_healthy
    environment:
      # Bind the prometheus exporter to all interfaces so the worker
      # (or a host-side scraper) can read counters. Default in
      # upstream's vm.args is loopback-only.
      AMOC_PROMETHEUS_IP: "{0, 0, 0, 0}"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "/opt/amoc/bin/amoc_arsenal_xmpp", "status"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  amoc-worker:
    container_name: awfy-amoc-worker
    hostname: amoc-worker
    # Reuse the image amoc-master just built (saves 5-10 min of cold
    # rebuild). The tag matches compose's auto-generated name
    # `<project>-<service>:latest` — `name:` at the top of this file
    # pins the project portion to `awfy_xmpp`.
    image: awfy_xmpp-amoc-master
    pull_policy: never
    depends_on:
      # Wait for all 3 brokers so AMOC doesn't try to open XMPP
      # connections to a node that's still in mid-boot. AMOC's
      # connect-or-exit on a phash2-selected unhealthy broker would
      # otherwise crash 1/3 of users on cold boot.
      amoc-master:
        condition: service_healthy
      mongooseim-1:
        condition: service_healthy
      mongooseim-2:
        condition: service_healthy
      mongooseim-3:
        condition: service_healthy
    environment:
      # Join the cluster headed by amoc-master. Until this is present
      # in the worker's amoc_config_env, amoc_cluster won't dial out
      # and `amoc_controller` stays in `disabled` state — which means
      # /execution/start hits "empty_nodes_list". The same env var
      # name is what upstream's ci/docker-compose.yml uses.
      AMOC_NODES: "['amoc_arsenal_xmpp@amoc-master']"
      AMOC_PROMETHEUS_IP: "{0, 0, 0, 0}"
      # amoc_config_env reads AMOC_<UPPERCASE_VAR> from the
      # environment and exposes them via `cfg/1` inside the scenario
      # module. These mirror the -required_variable declarations
      # in dynamic_domains_pm.erl + dynamic_domains.erl. The worker
      # is what actually opens XMPP connections, so the broker host
      # belongs on this side rather than on amoc-master.
      # AMOC_XMPP_SERVERS is the list amoc_xmpp:pick_server/1 shards
      # users over via phash2/2. List-of-lists: one inner list per
      # broker, each carrying escalus connection options. With 3
      # entries here, AMOC distributes users roughly 1/3 each across
      # mongooseim-1 / -2 / -3 — and CETS routes inter-domain PM
      # between brokers via shared session state so the dropped-
      # messages problem of independent brokers doesn't bite. We
      # also wait for mongooseim-2 and -3 healthchecks below so AMOC
      # doesn't try to dial a broker that's still booting.
      AMOC_XMPP_SERVERS: '[[{host, <<"mongooseim-1">>}], [{host, <<"mongooseim-2">>}], [{host, <<"mongooseim-3">>}]]'
      # MongooseIM host pinned to broker-1 for the legacy single-
      # broker code paths that still reach for one address. CETS
      # makes the actual session state cluster-wide so this is just
      # a "which broker has the user-management REST API" pointer.
      AMOC_MONGOOSE_HOST: "mongooseim-1"
      # GraphQL admin creds for `dynamic_domains:create_domain/2`.
      # Match the admin handler's username/password literals from
      # rel/files/mongooseim.toml; Dockerfile.mongoose also patches
      # the listener to bind to 0.0.0.0 and accept any Host header.
      # All three brokers share the Postgres-backed service_domain_db
      # via CETS, so an `addDomain` mutation on broker-1 propagates
      # to brokers 2 and 3 by the time the user dials in.
      AMOC_GRAPHQL_HOST: '<<"mongooseim-1">>'
      AMOC_GRAPHQL_USER: '<<"admin">>'
      AMOC_GRAPHQL_PASSWORD: '<<"secret">>'
      # Default is 60s, which on a measurement_duration_s=60 :local
      # config eats the entire sampling window — every user is still
      # in the post-create_domain sleep when the run ends. 1s is
      # enough headroom for the addDomain GraphQL mutation to finish
      # and propagate before subsequent users in the bucket try to
      # connect.
      AMOC_WAIT_TIME_FOR_DOMAIN_CREATION: "1"
      AMOC_DOMAIN_COUNT: "${DOMAINS:-10}"
      AMOC_DOMAIN_BUCKET_SIZE: "1"
      AMOC_INTERARRIVAL: "${INTERARRIVAL_MS:-5}"
      # Message-cadence knobs — Phase 1 keeps these short so a
      # local-scale run completes in ~60s after warmup.
      AMOC_MESSAGE_COUNT: "${MESSAGE_COUNT:-60}"
      AMOC_MESSAGE_INTERVAL: "${MESSAGE_INTERVAL_S:-1}"
      AMOC_DELAY_BEFORE_SENDING_MESSAGES: "${DELAY_BEFORE_S:-5}"
      AMOC_DELAY_AFTER_SENDING_MESSAGES: "${DELAY_AFTER_S:-5}"
    ulimits:
      # Match upstream — the worker opens ~1 socket per simulated
      # user. 66k headroom covers up to ~64k users per worker; the
      # :local shape is far smaller but a single uplifted setting
      # is easier to reason about than per-topology tuning.
      nofile:
        soft: 66000
        hard: 66000
