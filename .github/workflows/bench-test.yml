# Phase-0 validation workflow — see CLOUD_BENCH_PLAN.md.
#
# Runs the full benchmark pipeline on GitHub-hosted runners across
# Linux x86/ARM, macOS ARM, Windows x86. Free on public repos.
# Numbers are noisy (shared infrastructure) but pipeline correctness
# is the goal: confirm Dockerfile builds, installers work, mix tasks
# run, gh-pages publish succeeds.
#
# Three triggers, three default scopes for `otp_refs`:
#   * push            → "master"            (single ref, fast wiring check)
#   * schedule        → "26,27,28,master"   (cross-version data accumulation)
#   * workflow_dispatch → user-provided, default "26,27,28,master"
#
# `26` / `27` / `28` are shorthand — resolved to the latest patch tag
# (e.g. `OTP-26.2.5.20`) by the resolve job at run time.

name: bench-test

on:
  push:
  schedule:
    # Weekly Monday 06:00 UTC sweep across the 4 reference OTP versions.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      otp_refs:
        description: "Comma-separated OTP refs (tags / branches / SHAs / shorthand 26|27|28)"
        required: false
        default: "26,27,28,master"

permissions:
  contents: read

concurrency:
  # Multiple runs on the same trigger don't need to coexist; later cancels older.
  group: bench-test-${{ github.event_name }}
  cancel-in-progress: false

jobs:

  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.r.outputs.targets }}
    steps:
      - id: r
        env:
          INPUT_REFS: >-
            ${{ inputs.otp_refs ||
                (github.event_name == 'schedule' && '26,27,28,master' || 'master') }}
        run: |
          set -euo pipefail

          # Expand shorthand "26"/"27"/"28" to the latest matching OTP-X.Y.Z tag.
          expand_ref() {
            local r="$1"
            case "$r" in
              2[6-9]|3[0-9])
                git ls-remote --tags --refs https://github.com/erlang/otp.git "OTP-$r.*" \
                  | awk '{print $2}' \
                  | sed 's|refs/tags/||' \
                  | grep -E "^OTP-$r\.[0-9.]+$" \
                  | sort -V | tail -1
                ;;
              *) echo "$r" ;;
            esac
          }

          targets="["
          sep=""
          for raw in $(echo "$INPUT_REFS" | tr ',' ' '); do
            raw="$(echo "$raw" | xargs)" # trim whitespace
            ref="$(expand_ref "$raw")"
            if [ -z "$ref" ]; then
              echo "::error::could not expand shorthand '$raw'"
              exit 1
            fi
            sha="$(git ls-remote https://github.com/erlang/otp.git "$ref" | head -1 | cut -f1)"
            if [ -z "$sha" ]; then
              echo "::error::could not resolve ref '$ref' on erlang/otp"
              exit 1
            fi
            short="${sha:0:10}"
            label="${short}-test"
            targets="${targets}${sep}{\"ref\":\"$ref\",\"sha\":\"$sha\",\"short\":\"$short\",\"label\":\"$label\"}"
            sep=","
            echo "Resolved $raw → $ref → $sha"
          done
          targets="${targets}]"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Targets: $targets"

  build-linux:
    needs: resolve
    permissions:
      contents: read
      packages: write   # push image to GHCR
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { name: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ matrix.target.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test
          cache-from: type=gha,scope=linux-${{ matrix.arch.name }}
          cache-to: type=gha,scope=linux-${{ matrix.arch.name }},mode=max

  measure-linux:
    needs: [resolve, build-linux]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest }
          - { name: arm64,  runner: ubuntu-24.04-arm }
        flavor: [jit, emu]
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull benchmark image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test"
      - name: Preflight (advisory only — GHA runners always WARN)
        run: |
          docker run --rm \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test" \
            awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS_VAL: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mkdir -p "$PWD/results"
          docker run --rm \
            -e ERL_FLAGS="$ERL_FLAGS_VAL" \
            -v "$PWD/results:/app/results" \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test" \
            awfy.measure \
              --label "${{ matrix.target.label }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
              --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-windows:
    needs: resolve
    permissions:
      contents: read
      actions: read   # `gh run download` against erlang/otp
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
        flavor: [jit, emu]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install OTP
        shell: pwsh
        env:
          OTP_WIN_INSTALLER_URL: ${{ vars.OTP_WIN_INSTALLER_URL }}
          OTP_REF: ${{ matrix.target.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Elixir
        shell: pwsh
        run: |
          $version = "1.19.5"
          $url = "https://github.com/elixir-lang/elixir/releases/download/v$version/elixir-otp-28.zip"
          $zip = "$env:TEMP\elixir.zip"
          $dest = "$env:USERPROFILE\.local\elixir\$version"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile awfy
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        shell: pwsh
        run: mix awfy.preflight || $true
      - name: Measure (${{ matrix.flavor }})
        shell: pwsh
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mix awfy.measure `
            --label "${{ matrix.target.label }}-windows-x86_64-${{ matrix.flavor }}" `
            --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-macos:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
        flavor: [jit, emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build deps
        run: brew install autoconf openssl@3 ncurses
      - name: Build OTP from source
        id: otp
        env:
          OTP_REF: ${{ matrix.target.ref }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Install Elixir
        run: brew install elixir
      - name: Compile awfy
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        run: mix awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mix awfy.measure \
            --label "${{ matrix.target.label }}-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.short }}-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  publish:
    needs: [resolve, measure-linux, measure-windows, measure-macos]
    permissions:
      contents: write   # push to gh-pages
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Check out gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages _pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages _pages
            (cd _pages && git rm -rf . || true)
          fi

      - name: Stage new run-dirs
        run: |
          shopt -s nullglob
          for art in artifacts/*/; do
            for run in "$art"*/; do
              base="$(basename "$run")"
              dest="_pages/$base"
              if [ -d "$dest" ]; then
                echo "[skip] $base already on gh-pages"
                continue
              fi
              cp -r "$run" "$dest"
              echo "[copy] $base"
            done
          done

      - name: Regenerate dashboard
        run: |
          mix deps.get
          mix compile
          mix awfy.compare --out _pages

      - name: Commit + push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          cd _pages
          git add -A
          if git diff --staged --quiet; then
            echo "[publish] no changes"
            exit 0
          fi
          git commit -m "bench-test: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
