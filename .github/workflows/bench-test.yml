# Phase-0 validation workflow — see CLOUD_BENCH_PLAN.md.
#
# Runs the full benchmark pipeline on GitHub-hosted runners across
# Linux x86/ARM, macOS ARM, Windows x86. Free on public repos.
# Numbers are noisy (shared infrastructure) but pipeline correctness
# is the goal: confirm Dockerfile builds, installers work, mix tasks
# run, gh-pages publish succeeds. Once green across all platforms,
# promote to bench.yml (AWS + M5).
#
# Manual-trigger only — daily cron belongs in bench.yml.

name: bench-test

on:
  workflow_dispatch:
    inputs:
      otp_ref:
        description: "OTP ref (branch/tag/SHA) to benchmark"
        required: false
        default: "master"
      label:
        description: "Run label (default: short OTP SHA, suffixed -test)"
        required: false
      skip_macos:
        description: "Skip the macOS leg"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bench-test-${{ github.event.inputs.otp_ref || 'master' }}
  cancel-in-progress: false

jobs:

  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      otp_sha: ${{ steps.r.outputs.sha }}
      otp_short: ${{ steps.r.outputs.short }}
      otp_ref: ${{ steps.r.outputs.ref }}
      label: ${{ steps.r.outputs.label }}
    steps:
      - id: r
        env:
          INPUT_REF: ${{ github.event.inputs.otp_ref || 'master' }}
          INPUT_LABEL: ${{ github.event.inputs.label }}
        run: |
          REF="$INPUT_REF"
          SHA="$(git ls-remote https://github.com/erlang/otp.git "$REF" | head -1 | cut -f1)"
          if [ -z "$SHA" ]; then
            echo "::error::could not resolve $REF on erlang/otp"
            exit 1
          fi
          SHORT="${SHA:0:10}"
          LABEL="$INPUT_LABEL"
          [ -z "$LABEL" ] && LABEL="${SHORT}-test"
          {
            echo "sha=$SHA"
            echo "short=$SHORT"
            echo "ref=$REF"
            echo "label=$LABEL"
          } >> "$GITHUB_OUTPUT"
          echo "Phase-0 benchmarking erlang/otp@$SHA ($REF) as label '$LABEL'"

  build-linux:
    needs: resolve
    permissions:
      contents: read
      packages: write   # push image to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ needs.resolve.outputs.otp_sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.otp_sha }}-${{ matrix.arch }}-test
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-${{ matrix.arch }},mode=max

  measure-linux:
    needs: [resolve, build-linux]
    permissions:
      contents: read
      packages: read   # pull image from GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
        flavor: [jit, emu]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull benchmark image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.otp_sha }}-${{ matrix.arch }}-test"
      - name: Preflight (advisory only — GHA runners always WARN)
        run: |
          docker run --rm \
            "ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.otp_sha }}-${{ matrix.arch }}-test" \
            awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS_VAL: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mkdir -p "$PWD/results"
          docker run --rm \
            -e ERL_FLAGS="$ERL_FLAGS_VAL" \
            -v "$PWD/results:/app/results" \
            "ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.otp_sha }}-${{ matrix.arch }}-test" \
            awfy.measure \
              --label "${{ needs.resolve.outputs.label }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}" \
              --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-linux-${{ matrix.arch }}-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-windows:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [jit, emu]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install OTP
        shell: pwsh
        env:
          OTP_WIN_INSTALLER_URL: ${{ vars.OTP_WIN_INSTALLER_URL }}
          OTP_REF: ${{ needs.resolve.outputs.otp_ref }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Elixir
        shell: pwsh
        run: |
          $version = "1.19.5"
          $url = "https://github.com/elixir-lang/elixir/releases/download/v$version/elixir-otp-28.zip"
          $zip = "$env:TEMP\elixir.zip"
          $dest = "$env:USERPROFILE\.local\elixir\$version"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile awfy
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        shell: pwsh
        run: mix awfy.preflight; if ($LASTEXITCODE -ne 0) { exit 0 }
      - name: Measure (${{ matrix.flavor }})
        shell: pwsh
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mix awfy.measure `
            --label "${{ needs.resolve.outputs.label }}-windows-x86_64-${{ matrix.flavor }}" `
            --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-macos:
    needs: resolve
    permissions:
      contents: read
    if: ${{ github.event.inputs.skip_macos != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [jit, emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build deps
        run: brew install autoconf openssl@3 ncurses
      - name: Build OTP from source
        id: otp
        env:
          OTP_REF: ${{ needs.resolve.outputs.otp_ref }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Install Elixir
        run: |
          brew install elixir
      - name: Compile awfy
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        run: mix awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
        run: |
          mix awfy.measure \
            --label "${{ needs.resolve.outputs.label }}-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: results-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  publish:
    needs: [resolve, measure-linux, measure-windows, measure-macos]
    permissions:
      contents: write   # push to gh-pages
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Check out gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
            (cd site && git rm -rf . 2>/dev/null || true)
          fi

      - name: Merge new run dirs into gh-pages
        run: |
          shopt -s nullglob
          for art in artifacts/results-*/; do
            for run in "$art"*/; do
              [ -d "$run" ] || continue
              name="$(basename "$run")"
              dest="site/$name"
              [ -e "$dest" ] && continue
              cp -r "$run" "$dest"
            done
          done

      - name: Generate dashboard
        run: |
          shopt -s nullglob
          metas=(site/*/meta.json)
          if (( ${#metas[@]} == 0 )); then
            echo "no run dirs in site/ — nothing to publish"
            exit 0
          fi
          mix deps.get
          mix awfy.compare --out site

      - name: Commit and push
        run: |
          cd site
          git add -A
          if git diff --staged --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "publish-test: ${{ needs.resolve.outputs.label }} ($(date -u +%Y-%m-%d))"
          git push origin gh-pages
