# Phase-0 validation workflow — see PLAN/CLOUD_BENCH_PLAN.md.
#
# Runs the full benchmark pipeline on GitHub-hosted runners across
# Linux x86/ARM, macOS ARM, Windows x86. Free on public repos.
# Numbers are noisy (shared infrastructure) but pipeline correctness
# is the goal: confirm Dockerfile builds, installers work, mix tasks
# run, gh-pages publish succeeds.
#
# Three triggers, three default scopes for `otp_refs`:
#   * push            → "22.3,24.0,24.1,24.2,master"  (versions whose
#     measure-linux-target / measure-macos legs are currently failing
#     — push gives us a fast V=1 build log to diagnose against)
#   * schedule        → "20,21,23,24,28,master"  (weekly cross-version
#     data accumulation across the legacy + modern paths)
#   * workflow_dispatch → user-provided, same default as schedule
#
# `22.3` / `24.0` / `28` etc. are shorthand — resolved to the latest
# patch tag (e.g. `OTP-22.3.4` / `OTP-24.0.6`) by the resolve job at
# run time.

name: bench-test

on:
  push:
  schedule:
    # Weekly Monday 06:00 UTC sweep across the 4 reference OTP versions.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      otp_refs:
        description: "Comma-separated OTP refs (tags / branches / SHAs / shorthand 20|21|…)"
        required: false
        # Current testing set: a wide spread to validate both the
        # legacy target-runner path (20-23) and the modern flow (24+).
        default: "20,21,23,24,28,master"

permissions:
  contents: read

concurrency:
  # Multiple runs on the same trigger don't need to coexist; later cancels older.
  group: bench-test-${{ github.event_name }}
  cancel-in-progress: false

jobs:

  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Two separate matrices: targets_modern (OTP ≥ 24, runs through
      # the existing same-OTP peer flow with a per-target Docker image)
      # and targets_target_mode (OTP < 24, runs through the cross-OTP
      # target-runner — host orchestrator on modern Elixir/OTP, target
      # `erl` from a source build, no Docker). The split lets each path
      # keep the matrix shape that fits its build pipeline; the
      # has_* flags gate the corresponding measure jobs so an empty
      # array doesn't break matrix expansion.
      targets_modern: ${{ steps.r.outputs.targets_modern }}
      targets_target_mode: ${{ steps.r.outputs.targets_target_mode }}
      has_modern: ${{ steps.r.outputs.has_modern }}
      has_target_mode: ${{ steps.r.outputs.has_target_mode }}
    steps:
      - id: r
        env:
          INPUT_REFS: >-
            ${{ inputs.otp_refs ||
                (github.event_name == 'schedule' && '20,21,23,24,28,master' ||
                 '22.3,24.0,24.1,24.2,master') }}
          # Needed for the per-target commit-timestamp lookup; the
          # default GHA token is fine since erlang/otp is public.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Cached upstream version index. otp_versions.table lists
          # every released OTP version, newest-first, one per line:
          #   `OTP-X.Y[.Z[.P]] : <component versions> : ...`
          # Used for both shorthand expansion and the "all" backfill
          # token. One curl per workflow run; all lookups grep the
          # cached file.
          TABLE="$(mktemp)"
          curl -fsSL --max-time 15 \
            https://raw.githubusercontent.com/erlang/otp/master/otp_versions.table \
            > "$TABLE"

          # Token "all" → full backfill list: latest patch of every
          # OTP-21+ minor (skip RCs and 4-component "branched"
          # patches), plus OTP-20.3 (the only OTP-20 minor with a
          # buildable source archive — the .0/.1/.2 tarballs are
          # missing on erlang.org and miss config.guess/sub), plus
          # master. Table is newest-first so the first hit per
          # (major.minor) that survives the filter is the latest
          # non-branched patch; tac reverses to oldest-first so the
          # trend chart's category axis populates left-to-right.
          #
          # 4-component versions (OTP-X.Y.Z.P, e.g. OTP-25.1.2.1) are
          # emergency security backports off a specific 3-component
          # patch. They typically don't ship Windows installers, often
          # skip the upstream CI artifact path, and the perf delta
          # against the parent OTP-X.Y.Z is by design near-zero. The
          # backfill picks the latest 3-component patch of each minor
          # instead — that's the meaningful trend datapoint.
          if [ "$INPUT_REFS" = "all" ]; then
            PER_MINOR="$(awk '
              /^OTP-[0-9]/ {
                tag = $1
                if (tag ~ /-rc[0-9]/) next
                rest = tag; sub(/^OTP-/, "", rest)
                n = split(rest, p, ".")
                if (n >= 4) next                  # skip branched patches
                if (p[1] < 21) next
                key = p[1] "." p[2]
                if (!(key in seen)) { seen[key] = 1; print tag }
              }
            ' "$TABLE" | tac | tr "\n" "," )"
            INPUT_REFS="OTP-20.3,${PER_MINOR}master"
            echo "[resolve] expanded \"all\" → $INPUT_REFS"
          fi

          # Expand shorthand:
          #   - "20"            → OTP-20.3 (only buildable OTP-20).
          #   - "21".."29"/"30" → latest patch of that major.
          #   - "X.Y"           → latest patch of that minor.
          # Anything else (full tag, "master", "maint-*", SHA) passes
          # through verbatim.
          # `grep -m1` stops grep itself at the first match, so the
          # downstream `awk` pipe never sees a closed-write SIGPIPE
          # — important under `set -o pipefail`, which would otherwise
          # turn the SIGPIPE into a nonzero pipeline exit on shorthand
          # like "22.3" that matches many lines (most majors only have
          # one matching line, so the bug went unnoticed until we
          # added the X.Y form in the push-trigger default).
          expand_ref() {
            local r="$1"
            case "$r" in
              20) echo "OTP-20.3" ;;
              2[0-9]|3[0-9])
                grep -m1 -E "^OTP-$r\\.[0-9.]+ " "$TABLE" | awk '{print $1}'
                ;;
              [0-9][0-9].[0-9]|[0-9][0-9].[0-9][0-9])
                local re="OTP-${r//./\\.}"
                grep -m1 -E "^${re}(\\.|[ ])" "$TABLE" | awk '{print $1}'
                ;;
              *) echo "$r" ;;
            esac
          }

          # Determine the OTP major from the (possibly expanded) ref.
          # Used downstream to pick the right elixir-otp-XX.zip bundle.
          otp_major_for_ref() {
            local r="$1"
            case "$r" in
              OTP-*)
                echo "$r" | sed 's|^OTP-||' | cut -d. -f1
                ;;
              master|main)
                # Bumps when erlang/otp's master moves to the next major.
                echo "29"
                ;;
              maint-*)
                echo "$r" | sed 's|^maint-||'
                ;;
              *)
                # Fall back to fetching OTP_VERSION from the resolved SHA.
                local sha="$2"
                local v
                v="$(curl -fsSL "https://raw.githubusercontent.com/erlang/otp/$sha/OTP_VERSION" 2>/dev/null \
                     | head -1 | cut -d. -f1)"
                [ -n "$v" ] && echo "$v" || echo "29"
                ;;
            esac
          }

          # Pick a precompiled Elixir release that ships an
          # `elixir-otp-<major>.zip` bundle for this OTP. Elixir's
          # support window has shifted over time:
          #   * 1.14.5 → otp-23, 24, 25
          #   * 1.16.3 → otp-24, 25, 26
          #   * 1.17.3 → otp-25, 26, 27
          #   * 1.18.4 → otp-25, 26, 27 (1.18.5 dropped 26)
          #   * 1.19.5 → otp-27, 28
          # OTP < 24 has no matching elixir-otp-XX.zip; those targets
          # take the target-runner path (measure-linux-target) where
          # the host orchestrator runs on pinned modern Elixir/OTP and
          # shells out to the target erl. The :elixir field is still
          # populated for shape parity but not consumed there.
          elixir_version_for_major() {
            case "$1" in
              22|23) echo "1.14.5" ;;
              24)    echo "1.16.3" ;;
              25)    echo "1.17.3" ;;
              26)    echo "1.18.4" ;;
              27)    echo "1.19.5" ;;
              *)     echo "1.19.5" ;;
            esac
          }

          # Map an OTP major to the OTP suffix on the elixir-otp-XX.zip
          # bundle to download. This is identity for OTPs Elixir has
          # already released a bundle for, but caps at 28 for OTPs newer
          # than that (right now: master = OTP 29). The elixir-otp-29
          # bundle ships only on Elixir's `main-latest` rolling release;
          # the tagged `v1.19.5` doesn't include it. Bundles are
          # forward-compatible across one major so an elixir-otp-28
          # binary runs fine on an OTP 29 host. Bump the cap when
          # Elixir releases a tagged v1.20-or-later that ships otp-29.
          elixir_bundle_major_for_major() {
            case "$1" in
              22|23|24|25|26|27|28) echo "$1" ;;
              *) echo "28" ;;
            esac
          }

          modern="["
          legacy="["
          sep_m=""
          sep_l=""
          for raw in $(echo "$INPUT_REFS" | tr ',' ' '); do
            raw="$(echo "$raw" | xargs)" # trim whitespace
            ref="$(expand_ref "$raw")"
            if [ -z "$ref" ]; then
              echo "::error::could not expand shorthand '$raw'"
              exit 1
            fi
            # Resolve to a commit SHA. Annotated tags (which is how
            # OTP releases are tagged) need `^{}` to dereference the
            # tag object to the commit it points at; lightweight tags
            # and branches return empty for `^{}` so fall back to the
            # plain ref. Without this, the SHA below is the tag object
            # itself, which then 404s against the commits API.
            sha="$(git ls-remote https://github.com/erlang/otp.git "$ref^{}" | head -1 | cut -f1)"
            if [ -z "$sha" ]; then
              sha="$(git ls-remote https://github.com/erlang/otp.git "$ref" | head -1 | cut -f1)"
            fi
            if [ -z "$sha" ]; then
              echo "::error::could not resolve ref '$ref' on erlang/otp"
              exit 1
            fi
            short="${sha:0:10}"
            label="${short}-test"
            major="$(otp_major_for_ref "$ref" "$sha")"
            elixir="$(elixir_version_for_major "$major")"
            elixir_bundle="$(elixir_bundle_major_for_major "$major")"
            # The dashboard plots each run against this timestamp, so
            # benchmarking a year-old OTP today shouldn't make every old
            # release cluster at "now" — pull the commit's committer
            # date and let the run-dir position itself accordingly.
            #
            # gh api with --jq still writes the JSON error body to
            # stdout on 4xx responses (and returns exit 0 for some of
            # them), so pipe through local jq with a `// ""` default to
            # cleanly fall back to empty on any failure.
            commit_timestamp="$(gh api "repos/erlang/otp/commits/$sha" 2>/dev/null \
              | jq -r '.commit.committer.date // ""' 2>/dev/null \
              || echo "")"
            # OTP < 24's crypto NIF uses APIs OpenSSL 3 removed
            # (RSA_get0_crt_params, EVP_MD_meth_new, …). The GHA Ubuntu
            # image ships only OpenSSL 3, so for those targets drop
            # ssl/ssh/crypto entirely. OTP 24.0 and 24.1 still reference
            # FIPS_mode which OpenSSL 3 removed; 24.2+ dropped that and
            # builds cleanly. (Previous attempt also lumped 24.2 into
            # --without-ssl, but a recheck confirmed 24.2.2 builds fine
            # against OpenSSL 3 — the macOS build only failed there
            # because --without-ssl + parallel make races on old trees.)
            extra_configure=""
            if [ "$major" -lt 24 ] 2>/dev/null; then
                extra_configure="--without-ssl"
            elif [ "$major" -eq 24 ]; then
                case "$ref" in
                    OTP-24.0|OTP-24.1|OTP-24.0.*|OTP-24.1.*)
                        extra_configure="--without-ssl"
                        ;;
                esac
            fi
            # otp_label is what the dashboard plots on its x axis. We
            # carry the full resolved version ("28.5.4", "29.0-rc3")
            # for tagged refs so the snapshot legend is unambiguous —
            # the dashboard buckets by major for grouping. "master" /
            # "maint-*" pass through verbatim so they land at the
            # right edge of the trend chart.
            case "$ref" in
              master|main|maint-*) otp_label="$ref" ;;
              OTP-*) otp_label="${ref#OTP-}" ;;
              *) otp_label="$major" ;;
            esac
            entry="{\"ref\":\"$ref\",\"sha\":\"$sha\",\"short\":\"$short\",\"label\":\"$label\",\"major\":\"$major\",\"otp_label\":\"$otp_label\",\"elixir\":\"$elixir\",\"elixir_bundle\":\"$elixir_bundle\",\"commit_timestamp\":\"$commit_timestamp\",\"extra_configure\":\"$extra_configure\"}"

            # OTP < 24 has no compatible Elixir bundle, so the host
            # orchestrator can't compile against it. Route to the
            # target-runner path: build target OTP from source, run
            # the orchestrator on a pinned modern Elixir, shell out to
            # the target erl per benchmark.
            if [ "$major" -lt 24 ] 2>/dev/null; then
              legacy="${legacy}${sep_l}${entry}"
              sep_l=","
              echo "Resolved $raw → $ref → $sha (OTP $major, target-runner mode)"
            else
              modern="${modern}${sep_m}${entry}"
              sep_m=","
              echo "Resolved $raw → $ref → $sha (OTP $major, Elixir $elixir)"
            fi
          done
          modern="${modern}]"
          legacy="${legacy}]"

          # has_* drive `if:` on the dependent measure jobs so an empty
          # array doesn't break matrix expansion downstream.
          [ "$modern" = "[]" ] && has_modern=false || has_modern=true
          [ "$legacy" = "[]" ] && has_target_mode=false || has_target_mode=true

          {
            echo "targets_modern=$modern"
            echo "targets_target_mode=$legacy"
            echo "has_modern=$has_modern"
            echo "has_target_mode=$has_target_mode"
          } >> "$GITHUB_OUTPUT"
          echo "Modern targets:      $modern"
          echo "Target-mode targets: $legacy"

  build-linux:
    needs: resolve
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      packages: write   # push image to GHCR
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { name: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ matrix.target.sha }}
            OTP_REF=${{ matrix.target.ref }}
            ELIXIR_OTP_MAJOR=${{ matrix.target.elixir_bundle }}
            ELIXIR_VERSION=${{ matrix.target.elixir }}
          # Forwarded to fetch-otp-source.sh inside the build so it
          # can pull erlang/otp's `otp_prebuilt` CI artifact (prebuilt
          # beams + pre-run configure — saves several minutes per
          # cold build vs. /archive raw source).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test
          cache-from: type=gha,scope=linux-${{ matrix.arch.name }}
          cache-to: type=gha,scope=linux-${{ matrix.arch.name }},mode=max

  measure-linux:
    needs: [resolve, build-linux]
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest }
          - { name: arm64,  runner: ubuntu-24.04-arm }
        flavor: [jit, emu]
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull benchmark image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test"
      - name: Preflight (advisory only — GHA runners always WARN)
        run: |
          docker run --rm \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test" \
            awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS_VAL: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          mkdir -p "$PWD/results"
          docker run --rm \
            -e ERL_FLAGS="$ERL_FLAGS_VAL" \
            -e AWFY_OTP_COMMIT_TIMESTAMP="$AWFY_OTP_COMMIT_TIMESTAMP" \
            -e AWFY_OTP_VERSION="$AWFY_OTP_VERSION" \
            -v "$PWD/results:/app/results" \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}-test" \
            awfy.measure \
              --label "${{ matrix.target.label }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
              --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-windows:
    needs: resolve
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      actions: read   # `gh run download` against erlang/otp
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        # The upstream Windows installer ships JIT-only (no
        # beam.emu.dll). Measuring emu on Windows would require
        # building OTP from source on the runner (slow + fiddly on
        # Windows). Drop emu here; pick it back up if/when we have a
        # `make FLAVOR=emu` installer artifact to side-load.
        flavor: [jit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install OTP
        id: install_otp
        shell: pwsh
        env:
          OTP_WIN_INSTALLER_URL: ${{ vars.OTP_WIN_INSTALLER_URL }}
          OTP_REF: ${{ matrix.target.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          if ([string]::IsNullOrWhiteSpace($prefix)) {
            # Script emitted skipped=true (no Windows installer for
            # this tag — see install-otp-windows.ps1 Fetch-FromTag).
            # Bail before adding bogus PATH entries; downstream steps
            # are gated on steps.install_otp.outputs.skipped != 'true'.
            exit 0
          }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Elixir
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          # Elixir 1.19 dropped OTP 26 — keep 1.18 for OTP 26 only.
          ELIXIR_VERSION: ${{ matrix.target.elixir }}
          ELIXIR_OTP_MAJOR: ${{ matrix.target.elixir_bundle }}
        run: |
          $url = "https://github.com/elixir-lang/elixir/releases/download/v$env:ELIXIR_VERSION/elixir-otp-$env:ELIXIR_OTP_MAJOR.zip"
          $zip = "$env:TEMP\elixir.zip"
          $dest = "$env:USERPROFILE\.local\elixir\$env:ELIXIR_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install wmic shim
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        # Benchee.System.{available_memory,cpu_speed}/1 shell out to
        # WMIC for system fingerprinting. Recent GHA windows-latest
        # images drop WMIC; Benchee then prints stack traces because
        # the Erlang port `spawn_executable` raises :enoent (or
        # :eacces if the target is a .cmd/.bat — Windows CreateProcess
        # can only run real .exe/.com binaries directly).
        #
        # Add-WindowsCapability fetches WMIC from Windows Update on
        # demand, which routinely runs 5+ minutes. Compile a tiny C#
        # stub into a real wmic.exe instead — covers the two queries
        # Benchee makes by dispatching to PowerShell's CIM.
        run: |
          $shimDir = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null

          $cs = @'
          using System;
          using System.Diagnostics;
          class Wmic {
              static int Main(string[] args) {
                  string ps = null;
                  if (args.Length >= 3
                      && string.Equals(args[0], "COMPUTERSYSTEM", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "TOTALPHYSICALMEMORY", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output TotalPhysicalMemory; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory";
                  } else if (args.Length >= 3
                      && string.Equals(args[0], "CPU", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "NAME", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output Name; (Get-CimInstance Win32_Processor).Name";
                  } else {
                      return 1;
                  }
                  var psi = new ProcessStartInfo("powershell",
                      "-NoProfile -Command \"" + ps + "\"");
                  psi.UseShellExecute = false;
                  var p = Process.Start(psi);
                  p.WaitForExit();
                  return p.ExitCode;
              }
          }
          '@
          $csPath = Join-Path $env:TEMP "wmic.cs"
          $cs | Set-Content -Path $csPath -Encoding UTF8
          # .NET Framework 4 csc.exe lives at this fixed path on every
          # modern Windows install; doesn't need vcvars or VS env setup.
          $csc = "${env:WINDIR}\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:"$shimDir\wmic.exe" $csPath
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "wmic.exe shim at $shimDir\wmic.exe"
      - name: Compile awfy
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        run: mix awfy.preflight || $true
      - name: Measure (${{ matrix.flavor }})
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          mix awfy.measure `
            --label "${{ matrix.target.label }}-windows-x86_64-${{ matrix.flavor }}" `
            --ignore-preflight
      - if: steps.install_otp.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  measure-macos:
    needs: resolve
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        flavor: [jit, emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps
        run: brew install autoconf openssl@3 ncurses
      - name: Cache OTP build
        uses: actions/cache@v4
        with:
          # install-otp-source.sh content-addresses by SHA, so the
          # cache key is exact. Hits skip the 5-10 min source build
          # entirely; the script's own OTP_INSTALLED guard then just
          # recompiles the small target-beam tree. Same scheme as the
          # measure-linux-target leg below.
          #
          # The hashFiles segment busts the cache whenever any file
          # that materially affects the cached prefix changes:
          #
          #   * bin/install-otp-source.sh   — configure flags, build
          #     command, target-beam compile.
          #   * bin/fetch-otp-source.sh     — source resolution
          #     (release tarball / prebuilt artifact / archive).
          #   * patches/**                  — per-major OTP patches
          #     applied before configure.
          #   * .github/workflows/bench-test.yml — configure-flag
          #     env (AWFY_OTP_EXTRA_CONFIGURE, CFLAGS) is composed
          #     here; coarse but correct.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-macos-arm64-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench-test.yml') }}
      - name: Build OTP from source
        id: otp
        env:
          OTP_REF: ${{ matrix.target.ref }}
          # Per-ref extra configure flags computed in the resolve step —
          # currently `--without-ssl` for OTP versions whose crypto NIF
          # references APIs OpenSSL 3 removed (FIPS_mode etc.). Empty
          # for everything else; we then default to wiring up Homebrew's
          # keg-only openssl@3 so configure doesn't silently build
          # without crypto (which makes mix refuse to start with
          # "application crypto could not be found").
          #
          # GH_TOKEN: install-otp-source.sh may pull the `otp_prebuilt`
          # artifact from upstream's Build workflow for branch refs
          # (master). That download requires actions:read on erlang/otp;
          # the default GHA token works since erlang/otp is public.
          EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$EXTRA_CONFIGURE" ]; then
              export AWFY_OTP_EXTRA_CONFIGURE="$EXTRA_CONFIGURE"
          else
              export AWFY_OTP_EXTRA_CONFIGURE="--with-ssl=$(brew --prefix openssl@3)"
          fi
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Install Elixir
        # `brew install elixir` always pulls latest (1.19) which dropped
        # OTP 26. Use the precompiled bundle so we can pick the right
        # release per target.
        env:
          ELIXIR_VERSION: ${{ matrix.target.elixir }}
          ELIXIR_OTP_MAJOR: ${{ matrix.target.elixir_bundle }}
        run: |
          dest="$HOME/.local/elixir/$ELIXIR_VERSION"
          mkdir -p "$dest"
          url="https://github.com/elixir-lang/elixir/releases/download/v$ELIXIR_VERSION/elixir-otp-$ELIXIR_OTP_MAJOR.zip"
          curl -fL "$url" -o /tmp/elixir.zip
          unzip -q /tmp/elixir.zip -d "$dest"
          echo "$dest/bin" >> "$GITHUB_PATH"
      - name: Compile awfy
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — GHA runners always WARN)
        run: mix awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          mix awfy.measure \
            --label "${{ matrix.target.label }}-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  # ---------------------------------------------------------------
  # Target-runner path for OTP < 24 (no compatible Elixir bundle).
  # The host orchestrator runs on a pinned modern OTP/Elixir; the
  # target VM is built from source on the runner via
  # bin/install-otp-source.sh and shelled out to per benchmark.
  #
  # Linux x86_64 only for v1. Adding linux-arm64 + macos-arm64 paths
  # is mechanical (same script works on all three) but each adds a
  # ~10-min cold OTP build, so we widen as patches land per major.
  # OTP 20-23 only run the `emu` flavor — the JIT didn't exist yet,
  # and HiPE-as-jit-equivalent (compiling sources with `+native`)
  # isn't wired through the harness. See patches/README.md.
  # ---------------------------------------------------------------
  measure-linux-target:
    needs: resolve
    if: needs.resolve.outputs.has_target_mode == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_target_mode) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest }
        flavor: [emu]
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps for target OTP
        # ubuntu-latest's image has build-essential preinstalled; we
        # only need to top up the OTP-specific dev packages. OpenSSL 3
        # is what ships on Ubuntu 24.04 — OTP < 23's crypto NIF won't
        # compile against it without patches. That's the expected v1
        # state: builds fail per major until a patch lands under
        # patches/OTP-<major>/. See patches/README.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf m4 \
            libssl-dev libncurses-dev zlib1g-dev \
            ca-certificates curl patch
      - name: Cache target OTP build
        id: otp-cache
        uses: actions/cache@v4
        with:
          # install-otp-source.sh content-addresses by SHA, so the
          # cache key is exact. Hits skip the 5-10 min source build.
          # See the measure-macos cache block above for the full
          # rationale on the hashFiles segment.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-target-linux-${{ matrix.arch.name }}-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench-test.yml') }}
      - name: Build target OTP
        env:
          # Pass the ref name (e.g. OTP-20.3), not the SHA — install-otp-source.sh's
          # prebuilt-source URL probe matches on `OTP-*` so it can hit the
          # github-release / erlang.org tarball with prebuilt beams.
          # Passing only the SHA bypasses that path and falls through to
          # /archive/<sha>.tar.gz, which lacks config.guess on older OTPs.
          OTP_REF: ${{ matrix.target.ref }}
          # Empty for OTP ≥ 24 (crypto compiles fine against OpenSSL 3
          # so the suite can use it); `--without-ssl` for OTP < 24
          # whose crypto NIF needs OpenSSL 1.1. Computed in resolve.
          AWFY_OTP_EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          # GCC 10+ defaults to `-fno-common`, which breaks the OTP 20
          # link step (`multiple definition of erts_allctr_wrappers` in
          # erts/emulator/beam/erl_alloc.h). `-fcommon` restores the
          # older behaviour and is harmless on newer OTPs that don't
          # trigger the conflict.
          #
          # OTP's configure REPLACES (not appends) when CFLAGS env is
          # set, and refuses to run unless -O is present. So we have
          # to bake in the defaults (-O2 -g) ourselves.
          CFLAGS: -O2 -g -fcommon
          # Same prebuilt-artifact caveat as the macOS build step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "AWFY_TARGET_ERL=$PREFIX/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PREFIX/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          # Pinned modern host. The orchestrator never touches the
          # target erl directly — only via TargetRunner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }})
        # AWFY_TARGET_ERL / AWFY_TARGET_BEAMS were exported via
        # GITHUB_ENV in the build step. Setting them here would
        # re-export the literal strings (with un-expanded `~`), so we
        # rely on the env file inheritance instead.
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          mix awfy.measure \
            --label "${{ matrix.target.label }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
            --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 7

  publish:
    needs: [resolve, measure-linux, measure-linux-target, measure-windows, measure-macos]
    permissions:
      contents: write   # push to gh-pages
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Check out gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages _pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages _pages
            (cd _pages && git rm -rf . || true)
          fi

      - name: Stage new run-dirs
        run: |
          shopt -s nullglob
          for art in artifacts/*/; do
            for run in "$art"*/; do
              base="$(basename "$run")"
              dest="_pages/$base"
              if [ -d "$dest" ]; then
                echo "[skip] $base already on gh-pages"
                continue
              fi
              cp -r "$run" "$dest"
              echo "[copy] $base"
            done
          done

      - name: Regenerate dashboard
        run: |
          mix deps.get
          mix compile
          mix awfy.compare --out _pages

      - name: Commit + push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          cd _pages
          git add -A
          if git diff --staged --quiet; then
            echo "[publish] no changes"
            exit 0
          fi
          git commit -m "bench-test: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
