        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "AWFY_TARGET_ERL=$PREFIX/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PREFIX/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - name: Download target bundle
        uses: actions/download-artifact@v8
        with:
          name: target-bundle-${{ steps.elixir.outputs.version }}
          path: bundle-tar/
      - name: Extract bundle
        run: |
          mkdir -p bundle
          tar xzf "bundle-tar/target_bundle_${{ steps.elixir.outputs.version }}.tar.gz" -C bundle --strip-components=1
          echo "AWFY_TARGET_BUNDLE=$PWD/bundle" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }}, --runner=bundle)
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
        run: |
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          mix awfy.measure \
            --runner=bundle \
            --label "${{ matrix.target.label }}-v2-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight \
            $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-v2-${{ matrix.target.short }}-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # Aggregate every uploaded results/ dir onto gh-pages and
  # regenerate the dashboard. Always GHA-hosted (no benchmark
  # accuracy needed). Runs even if some measure jobs fail —
  # partial sweeps still produce a useful update. Phase 2's
  # `-target-v2` jobs upload to a separate artifact namespace
  # (`results-v2-*`) so the dashboard's own pattern (`results-*`)
  # picks them up only if we explicitly stage them — for v2 we
  # leave them off the dashboard until parity is confirmed.
  publish:
    needs:
      - resolve
      - measure-linux
      - measure-linux-target
      - measure-linux-target-v2
      - measure-windows
      - measure-windows-target
      - measure-windows-target-v2
      - measure-macos
      - measure-macos-target
      - measure-macos-target-v2
    permissions:
      contents: write   # push to gh-pages
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Check out gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages _pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages _pages
            (cd _pages && git rm -rf . || true)
          fi

      # `all` is the "rebuild from scratch" mode — wipe the
      # existing run-dirs (and stale rendered HTML) so the dashboard
      # ends up reflecting only this workflow's freshly-built data,
      # with consistent labels (the previous mistake we hit was
      # bare-`maint` runs being recorded as "28" before the
      # otp_label fix in 944ba64a, then sticking around because the
      # fill skip logic kept them). Preserves _pages/.git so the
      # worktree stays valid.
      - name: Wipe existing gh-pages content (`all` mode)
        if: needs.resolve.outputs.wipe_gh_pages == 'true'
        run: |
          echo "[publish] wiping all existing content from gh-pages worktree"
          find _pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

      # Push events run as a smoke test of the workflow itself, but
      # their measurement output is noise we don't want polluting
      # the dashboard. Skip the staging step on push and let the
      # regenerate step below re-render against whatever's already
      # on gh-pages — so dashboard code changes show up without
      # adding new data points.
      - name: Stage new run-dirs
        if: github.event_name != 'push'
        run: |
          shopt -s nullglob
          for art in artifacts/*/; do
            for run in "$art"*/; do
              base="$(basename "$run")"
              dest="_pages/$base"
              if [ -d "$dest" ]; then
                echo "[skip] $base already on gh-pages"
                continue
              fi
              cp -r "$run" "$dest"
              echo "[copy] $base"
            done
          done

      - name: Regenerate dashboard
        run: |
          mix deps.get
          mix compile
          mix awfy.compare --out _pages

      - name: Commit + push
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          cd _pages
          git add -A
          if git diff --staged --quiet; then
            echo "[publish] no changes"
            exit 0
          fi
          git commit -m "bench: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
