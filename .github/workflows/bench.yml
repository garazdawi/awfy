# Cloud benchmark workflow — see CLOUD_BENCH_PLAN.md.
#
# Runs the AWFY suite against erlang/otp on a weekly cron via
# Terraform-managed ephemeral self-hosted runners on AWS EC2,
# pinned to c6i.4xlarge (Linux x86 and Windows) and c7g.4xlarge
# (Linux ARM Graviton 3). Each benchmark process owns one physical
# core (and its hyperthread sibling on Intel, by virtue of the
# affinity mask) — gets us to ~3-5% CV without paying ~$1,100/yr
# for full bare-metal. See CLOUD_BENCH_PLAN.md § Cost per sweep
# and terraform/README.md for the runner setup.
#
# Triggers:
#   * schedule         → weekly Monday 06:00 UTC, latest patch of
#                        each currently-tracked feature release.
#   * workflow_dispatch → operator-driven; the `otp_refs` input
#                        accepts a comma-separated list and is the
#                        backfill entry point. See
#                        CLOUD_BENCH_PLAN.md § Backfill.
#
# Push triggers are intentionally NOT wired here. Every push to
# master against AWS would roughly double the bill (see plan); the
# Phase-0 `bench-test.yml` workflow on free GHA-hosted runners
# covers wiring sanity on every commit.
#
# macOS is not part of this workflow — it's local-fill on the
# operator's M5 via `mix awfy.fill`. See SETUP.md § 3.

name: bench

on:
  schedule:
    # Weekly Monday 06:00 UTC. Picks up whatever each feature
    # release's latest patch resolves to at run time, plus master.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      otp_refs:
        description: "Comma-separated OTP refs (tags / branches / SHAs / shorthand 20|21|…). Use the full feature-release list for backfill."
        required: false
        # Steady-state cron sweep: a handful of recent feature
        # releases plus master. Override at dispatch time for
        # backfill (e.g. "20.0,20.1,20.2,21.0,21.1,...,28.5,master").
        default: "26,27,28,master"

permissions:
  contents: read

concurrency:
  # Same-trigger runs serialise; in-flight ones aren't cancelled
  # since each sweep is a complete data point we'd rather finish.
  group: bench-${{ github.event_name }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------
  # Resolve the comma-separated `otp_refs` input into a matrix of
  # (ref, sha, label, major, ...) entries — same shape as
  # bench-test.yml's resolve job. Two outputs:
  #   * targets_modern   — OTP ≥ 24, runs the same-OTP peer flow
  #     against a per-target Docker image.
  #   * targets_target_mode — OTP < 24, runs through the cross-OTP
  #     target runner (host on modern Elixir/OTP, target erl from
  #     a source build, no Docker).
  # has_* gate the dependent measure jobs so an empty matrix
  # doesn't break expansion downstream.
  # ---------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets_modern: ${{ steps.r.outputs.targets_modern }}
      targets_target_mode: ${{ steps.r.outputs.targets_target_mode }}
      has_modern: ${{ steps.r.outputs.has_modern }}
      has_target_mode: ${{ steps.r.outputs.has_target_mode }}
    steps:
      - id: r
        env:
          INPUT_REFS: >-
            ${{ inputs.otp_refs ||
                (github.event_name == 'schedule' && '26,27,28,master' || 'master') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Cached upstream version index. otp_versions.table lists
          # every released OTP version, newest-first, one per line:
          #   `OTP-X.Y[.Z[.P]] : <component versions> : ...`
          # Used for both shorthand expansion and the "all" backfill
          # token. One curl per workflow run; all lookups grep the
          # cached file.
          TABLE="$(mktemp)"
          curl -fsSL --max-time 15 \
            https://raw.githubusercontent.com/erlang/otp/master/otp_versions.table \
            > "$TABLE"

          # Token "all" → full backfill list: latest patch of every
          # OTP-21+ minor (skip RCs), plus OTP-20.3 (the only OTP-20
          # minor with a buildable source archive — the .0/.1/.2
          # tarballs are missing on erlang.org and miss
          # config.guess/sub), plus master. Table is newest-first so
          # the first hit per (major.minor) is the latest patch; tac
          # reverses to oldest-first so the trend chart's category
          # axis populates left-to-right.
          if [ "$INPUT_REFS" = "all" ]; then
            PER_MINOR="$(awk '
              /^OTP-[0-9]/ {
                tag = $1
                if (tag ~ /-rc[0-9]/) next
                rest = tag; sub(/^OTP-/, "", rest)
                n = split(rest, p, ".")
                if (p[1] < 21) next
                key = p[1] "." p[2]
                if (!(key in seen)) { seen[key] = 1; print tag }
              }
            ' "$TABLE" | tac | tr "\n" "," )"
            INPUT_REFS="OTP-20.3,${PER_MINOR}master"
            echo "[resolve] expanded \"all\" → $INPUT_REFS"
          fi

          # Expand shorthand:
          #   - "20"            → OTP-20.3 (only buildable OTP-20).
          #   - "21".."29"/"30" → latest patch of that major.
          #   - "X.Y"           → latest patch of that minor.
          # Anything else (full tag, "master", "maint-*", SHA) passes
          # through verbatim.
          expand_ref() {
            local r="$1"
            case "$r" in
              20) echo "OTP-20.3" ;;
              2[0-9]|3[0-9])
                grep -E "^OTP-$r\\.[0-9.]+ " "$TABLE" \
                  | head -1 | awk '{print $1}'
                ;;
              [0-9][0-9].[0-9]|[0-9][0-9].[0-9][0-9])
                local re="OTP-${r//./\\.}"
                grep -E "^${re}(\\.|[ ])" "$TABLE" \
                  | head -1 | awk '{print $1}'
                ;;
              *) echo "$r" ;;
            esac
          }

          otp_major_for_ref() {
            local r="$1"
            case "$r" in
              OTP-*) echo "$r" | sed 's|^OTP-||' | cut -d. -f1 ;;
              master|main) echo "29" ;;
              maint-*) echo "$r" | sed 's|^maint-||' ;;
              *)
                local sha="$2" v
                v="$(curl -fsSL "https://raw.githubusercontent.com/erlang/otp/$sha/OTP_VERSION" 2>/dev/null \
                     | head -1 | cut -d. -f1)"
                [ -n "$v" ] && echo "$v" || echo "29"
                ;;
            esac
          }

          elixir_version_for_major() {
            case "$1" in
              22|23) echo "1.14.5" ;;
              24)    echo "1.16.3" ;;
              25)    echo "1.17.3" ;;
              26)    echo "1.18.4" ;;
              27)    echo "1.19.5" ;;
              *)     echo "1.19.5" ;;
            esac
          }

          elixir_bundle_major_for_major() {
            case "$1" in
              22|23|24|25|26|27|28) echo "$1" ;;
              *) echo "28" ;;
            esac
          }

          modern="["
          legacy="["
          sep_m=""
          sep_l=""
          for raw in $(echo "$INPUT_REFS" | tr ',' ' '); do
            raw="$(echo "$raw" | xargs)"
            ref="$(expand_ref "$raw")"
            if [ -z "$ref" ]; then
              echo "::error::could not expand shorthand '$raw'"
              exit 1
            fi
            sha="$(git ls-remote https://github.com/erlang/otp.git "$ref^{}" | head -1 | cut -f1)"
            if [ -z "$sha" ]; then
              sha="$(git ls-remote https://github.com/erlang/otp.git "$ref" | head -1 | cut -f1)"
            fi
            if [ -z "$sha" ]; then
              echo "::error::could not resolve ref '$ref' on erlang/otp"
              exit 1
            fi
            short="${sha:0:10}"
            # No -test suffix here; bench.yml writes production data
            # to gh-pages.
            label="$short"
            major="$(otp_major_for_ref "$ref" "$sha")"
            elixir="$(elixir_version_for_major "$major")"
            elixir_bundle="$(elixir_bundle_major_for_major "$major")"
            commit_timestamp="$(gh api "repos/erlang/otp/commits/$sha" 2>/dev/null \
              | jq -r '.commit.committer.date // ""' 2>/dev/null \
              || echo "")"
            extra_configure=""
            if [ "$major" -lt 24 ] 2>/dev/null; then
                extra_configure="--without-ssl"
            fi
            # Carry the full resolved version ("28.5.4", "29.0-rc3")
            # so the snapshot legend is unambiguous; the dashboard
            # buckets to major-only for grouping logic. "master" /
            # "maint-*" pass through verbatim.
            case "$ref" in
              master|main|maint-*) otp_label="$ref" ;;
              OTP-*) otp_label="${ref#OTP-}" ;;
              *) otp_label="$major" ;;
            esac
            entry="{\"ref\":\"$ref\",\"sha\":\"$sha\",\"short\":\"$short\",\"label\":\"$label\",\"major\":\"$major\",\"otp_label\":\"$otp_label\",\"elixir\":\"$elixir\",\"elixir_bundle\":\"$elixir_bundle\",\"commit_timestamp\":\"$commit_timestamp\",\"extra_configure\":\"$extra_configure\"}"

            if [ "$major" -lt 24 ] 2>/dev/null; then
              legacy="${legacy}${sep_l}${entry}"
              sep_l=","
              echo "Resolved $raw → $ref → $sha (OTP $major, target-runner mode)"
            else
              modern="${modern}${sep_m}${entry}"
              sep_m=","
              echo "Resolved $raw → $ref → $sha (OTP $major, Elixir $elixir)"
            fi
          done
          modern="${modern}]"
          legacy="${legacy}]"

          [ "$modern" = "[]" ] && has_modern=false || has_modern=true
          [ "$legacy" = "[]" ] && has_target_mode=false || has_target_mode=true

          {
            echo "targets_modern=$modern"
            echo "targets_target_mode=$legacy"
            echo "has_modern=$has_modern"
            echo "has_target_mode=$has_target_mode"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # Build the per-target Linux benchmark image. Free GHA minutes
  # (public repo); the cloud workflow pays only for measure time.
  # ---------------------------------------------------------------
  build-linux:
    needs: resolve
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { name: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ matrix.target.sha }}
            OTP_REF=${{ matrix.target.ref }}
            ELIXIR_OTP_MAJOR=${{ matrix.target.elixir_bundle }}
            ELIXIR_VERSION=${{ matrix.target.elixir }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}
          cache-from: type=gha,scope=linux-${{ matrix.arch.name }}
          cache-to: type=gha,scope=linux-${{ matrix.arch.name }},mode=max

  # ---------------------------------------------------------------
  # Linux measurements on Terraform-managed ephemeral self-hosted
  # runners. Runner pools `awfy-bench-linux-x86_64` (c6i.4xlarge)
  # and `awfy-bench-linux-arm64` (c7g.4xlarge); each instance is
  # spun up by the philips-labs Lambda on a workflow_job webhook,
  # registers as one-shot, runs this job, and terminates. See
  # terraform/README.md and SETUP.md § 2.
  #
  # CPU pinning: docker --cpuset-cpus=0 confines the entire container
  # (mix orchestrator + peer + benchmark erl) to vCPU 0. On the Intel
  # c6i, vCPU 0's hyperthread sibling is vCPU 8; we leave 8 idle so
  # the core has no contention from other tenant code. On Graviton 3
  # (c7g) there's no SMT, so vCPU 0 is one full physical core
  # uncontended.
  # ---------------------------------------------------------------
  measure-linux:
    needs: [resolve, build-linux]
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        arch: [x86_64, arm64]
        flavor: [jit, emu]
    runs-on:
      - self-hosted
      - awfy-bench-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull benchmark image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch }}"
      - name: Preflight (advisory only — cloud runners always WARN)
        run: |
          docker run --rm \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch }}" \
            awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS_VAL: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          mkdir -p "$PWD/results"
          docker run --rm \
            --cpuset-cpus=0 \
            -e ERL_FLAGS="$ERL_FLAGS_VAL" \
            -e AWFY_OTP_COMMIT_TIMESTAMP="$AWFY_OTP_COMMIT_TIMESTAMP" \
            -e AWFY_OTP_VERSION="$AWFY_OTP_VERSION" \
            -v "$PWD/results:/app/results" \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch }}" \
            awfy.measure \
              --label "${{ matrix.target.label }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}" \
              --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------
  # Windows measurements on the Terraform-managed `awfy-bench-windows`
  # pool (c6i.4xlarge + Windows AMI). No Docker — Windows containers
  # are slow and licensing-heavy.
  #
  # CPU pinning: set the PowerShell process's ProcessorAffinity to
  # CPU 0 before invoking mix; child processes (mix, erl, peer)
  # inherit it on Windows.
  # ---------------------------------------------------------------
  measure-windows:
    needs: resolve
    if: needs.resolve.outputs.has_modern == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern) }}
        # Windows installer ships JIT-only — no beam.emu.dll. Drop
        # emu here; pick it back up if/when the upstream installer
        # bundles emu, or if we side-load a local FLAVOR=emu build.
        flavor: [jit]
    runs-on:
      - self-hosted
      - awfy-bench-windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install OTP
        shell: pwsh
        env:
          OTP_WIN_INSTALLER_URL: ${{ vars.OTP_WIN_INSTALLER_URL }}
          OTP_REF: ${{ matrix.target.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Elixir
        shell: pwsh
        env:
          ELIXIR_VERSION: ${{ matrix.target.elixir }}
          ELIXIR_OTP_MAJOR: ${{ matrix.target.elixir_bundle }}
        run: |
          $url = "https://github.com/elixir-lang/elixir/releases/download/v$env:ELIXIR_VERSION/elixir-otp-$env:ELIXIR_OTP_MAJOR.zip"
          $zip = "$env:TEMP\elixir.zip"
          $dest = "$env:USERPROFILE\.local\elixir\$env:ELIXIR_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile awfy
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — cloud runners always WARN)
        shell: pwsh
        run: mix awfy.preflight || $true
      - name: Measure (${{ matrix.flavor }})
        shell: pwsh
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          # Pin the PowerShell process (and its children: mix, erl,
          # peer) to logical processor 0 — bitmask 0x1. On c6i.4xlarge
          # vCPU 0's hyperthread sibling is vCPU 8 (not in the mask),
          # so the physical core has no other work scheduled on it.
          [System.Diagnostics.Process]::GetCurrentProcess().ProcessorAffinity = [IntPtr]1
          mix awfy.measure `
            --label "${{ matrix.target.label }}-windows-x86_64-${{ matrix.flavor }}" `
            --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------
  # Cross-OTP target-runner path for OTP < 24. Host orchestrator
  # runs on a pinned modern Elixir/OTP, target erl is built from
  # source; the orchestrator shells out to the target erl per
  # benchmark. Same Linux runner pools as the modern flow —
  # different setup steps because there's no Docker image for
  # target-runner mode.
  #
  # CPU pinning: taskset -c 0 wraps the mix invocation. Children
  # (peer, target erl) inherit the affinity mask.
  # ---------------------------------------------------------------
  measure-linux-target:
    needs: resolve
    if: needs.resolve.outputs.has_target_mode == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_target_mode) }}
        arch: [x86_64, arm64]
        flavor: [jit, emu]
    runs-on:
      - self-hosted
      - awfy-bench-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps for target OTP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf m4 \
            libssl-dev libncurses-dev zlib1g-dev \
            ca-certificates curl patch
      - name: Cache target OTP build
        id: otp-cache
        uses: actions/cache@v4
        with:
          # See bench-test.yml for the rationale on the hashFiles
          # segment — same scheme.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-target-linux-${{ matrix.arch }}-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench.yml') }}
      - name: Build target OTP
        env:
          OTP_REF: ${{ matrix.target.ref }}
          AWFY_OTP_EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          CFLAGS: -O2 -g -fcommon
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "AWFY_TARGET_ERL=$PREFIX/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PREFIX/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          # Host orchestrator only — never invokes the target erl
          # directly, only via TargetRunner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }})
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
        run: |
          taskset -c 0 mix awfy.measure \
            --label "${{ matrix.target.label }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}" \
            --ignore-preflight
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------
  # Aggregate every uploaded results/ dir onto gh-pages and
  # regenerate the dashboard. Runs even if some measure jobs fail —
  # partial sweeps still produce a useful update. macOS run-dirs
  # join later via `mix awfy.fill` on the operator's Mac.
  # ---------------------------------------------------------------
  publish:
    needs: [resolve, measure-linux, measure-windows, measure-linux-target]
    permissions:
      contents: write
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: results-*
          merge-multiple: false

      - name: Check out gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages _pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages _pages
            (cd _pages && git rm -rf . 2>/dev/null || true)
          fi

      - name: Merge new run dirs into gh-pages
        run: |
          shopt -s nullglob
          for art in artifacts/results-*/; do
            for run in "$art"*/; do
              [ -d "$run" ] || continue
              base="$(basename "$run")"
              dest="_pages/$base"
              if [ -e "$dest" ]; then
                echo "[skip] $base already on gh-pages"
                continue
              fi
              cp -r "$run" "$dest"
            done
          done

      - name: Generate dashboard
        run: |
          shopt -s nullglob
          metas=(_pages/*/meta.json)
          if (( ${#metas[@]} == 0 )); then
            echo "no run dirs in _pages/ — nothing to publish"
            exit 0
          fi
          mix deps.get
          mix awfy.compare --out _pages

      - name: Commit and push
        run: |
          cd _pages
          git add -A
          if git diff --staged --quiet; then
            echo "[publish] no changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "bench: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
