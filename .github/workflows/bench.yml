# Unified benchmark workflow.
#
# Three runtime axes:
#   * trigger:   push / schedule / workflow_dispatch
#   * pool:      gha (free GitHub-hosted, default) or aws (Terraform-
#                managed self-hosted ephemeral c6i/c7g instances —
#                see PLAN/CLOUD_BENCH_PLAN.md and terraform/README.md)
#   * scope:     `otp_refs` input — concrete refs, shorthand
#                (21, 22.3), `fill`, or `all`
#
# These axes compose: a push always runs `runner_pool=gha` (we don't
# want pushes paying AWS bills); a schedule defaults to `gha` (free
# nightly fills against gh-pages) but can be flipped to `aws` once
# the production pool is committed; a workflow_dispatch lets the
# operator pick.
#
# Anything that doesn't need bare-metal hardware accuracy stays on
# free GHA-hosted Linux regardless of `runner_pool`: that's `resolve`,
# `build-linux` (Docker image build), and `publish`. Only the
# measure-* jobs route to AWS when `runner_pool=aws`.
#
# Default scopes per trigger:
#   * push            → "21,28,master" — minimal smoke covering both
#     code paths (legacy target-runner via 21, modern peer-flow via
#     28, source archive via master). Fast on warm cache.
#   * schedule        → "fill" — weekly catch-up; rebuilds anything
#     missing from gh-pages but skips refs already published.
#   * workflow_dispatch → user-provided, defaults to "fill".
#
# Special tokens for `otp_refs`:
#   * "all"  — expand to the maint-tip of every major from OTP-20
#              onwards (the active maint branch only — grey
#              sub-branches like maint-23.2 are skipped) + master.
#              Triggers a `wipe_gh_pages` flag so the dashboard ends
#              up reflecting only this run's data with consistent
#              labels.
#   * "fill" — same candidate set as "all", then drop refs whose
#              run-dirs are already on gh-pages. Cheap idempotent
#              backfill; safe to run on cron.
#
# Optional `benchmarks` input (workflow_dispatch only): comma list
# like `Bounce,CD`. When set, every measure-* job passes
# `--benchmarks <list>` to mix awfy.measure so only those benchmarks
# run. Combined with `fill`, the per-ref skip check tightens to
# "skip if every requested benchmark already has a `.benchee` for
# every platform".
#
# `22.3` / `24.0` / `28` etc. are shorthand — resolved to the latest
# patch tag (e.g. `OTP-22.3.4` / `OTP-24.0.6`) by the resolve job.

name: bench

on:
  push:
  schedule:
    # Weekly Monday 06:00 UTC — fill-mode catch-up against gh-pages.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runner_pool:
        description: "Where measure-* jobs run. `gha` = free GitHub-hosted (smoke / nightly); `aws` = Terraform self-hosted bare-metal."
        type: choice
        options: [gha, aws]
        default: gha
      otp_refs:
        description: "Comma-separated OTP refs (tags / branches / SHAs / shorthand 20|21|…), or 'fill' / 'all'"
        required: false
        # 'fill' is the friendly default — runs whatever's missing
        # from gh-pages and no more. Pass 'all' for a full rebuild,
        # or a comma list to target specific refs.
        default: "fill"
      benchmarks:
        description: "Comma-separated benchmark names (Bounce,CD,…) — empty = full suite. Pair with 'fill' to backfill a single benchmark across refs that don't yet have its data."
        required: false
        default: ""

permissions:
  contents: read

# Same trigger + same scope shouldn't race; later run queues. A
# long-running schedule run can't cancel an in-flight push smoke
# test, and two pushes against the same ref-set queue rather than
# clobbering each other's artifacts.
concurrency:
  group: bench-${{ github.event_name }}-${{ inputs.otp_refs || 'default' }}
  cancel-in-progress: false

jobs:

  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Six per-(major, platform) target lists. Two majors:
      #   * modern_*  — OTP ≥ 24, runs through the same-OTP peer flow
      #                 with a per-target Docker image on Linux,
      #                 setup-beam on Windows, source build on macOS.
      #   * legacy_*  — OTP < 24, runs through the cross-OTP
      #                 target-runner: host orchestrator on modern
      #                 Elixir/OTP shells out to a target `erl` built
      #                 from source via install-otp-source.sh.
      # Three platforms (linux / macos / windows) for each. Splitting
      # along both axes lets `fill` route a partially-published ref
      # only to the legs that are missing — adding a new platform
      # later doesn't force a re-run of refs that already have all
      # the older platforms.
      #
      # The has_* booleans gate the corresponding measure job's `if:`
      # so an empty array doesn't break matrix expansion downstream.
      targets_modern_linux:   ${{ steps.r.outputs.targets_modern_linux }}
      targets_modern_macos:   ${{ steps.r.outputs.targets_modern_macos }}
      targets_modern_windows: ${{ steps.r.outputs.targets_modern_windows }}
      targets_legacy_linux:   ${{ steps.r.outputs.targets_legacy_linux }}
      targets_legacy_macos:   ${{ steps.r.outputs.targets_legacy_macos }}
      targets_legacy_windows: ${{ steps.r.outputs.targets_legacy_windows }}
      has_modern_linux:   ${{ steps.r.outputs.has_modern_linux }}
      has_modern_macos:   ${{ steps.r.outputs.has_modern_macos }}
      has_modern_windows: ${{ steps.r.outputs.has_modern_windows }}
      has_legacy_linux:   ${{ steps.r.outputs.has_legacy_linux }}
      has_legacy_macos:   ${{ steps.r.outputs.has_legacy_macos }}
      has_legacy_windows: ${{ steps.r.outputs.has_legacy_windows }}
      # Pass-through for the workflow input. Empty = full suite.
      # Threaded into every measure-* job's awfy.measure invocation
      # as `--benchmarks <list>` when non-empty.
      benchmarks: ${{ inputs.benchmarks || '' }}
      # Set when INPUT_REFS=all — tells the publish job to wipe the
      # gh-pages worktree's run-dirs before staging this run's
      # results, so the dashboard ends up with only the freshly-built
      # data (and consistent labels).
      wipe_gh_pages: ${{ steps.r.outputs.wipe_gh_pages }}
      # Resolved once at the top so every downstream `runs-on:` and
      # measure step can branch consistently. Push events are pinned
      # to GHA regardless of the dispatch input — pushes don't pay
      # AWS bills.
      runner_pool: ${{ steps.r.outputs.runner_pool }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: r
        env:
          # Three triggers, three default scopes:
          #   * push            → minimal smoke (one ref per code path)
          #   * schedule        → fill-mode catch-up
          #   * workflow_dispatch → user-provided (defaults to fill)
          INPUT_REFS: >-
            ${{ inputs.otp_refs ||
                (github.event_name == 'schedule' && 'fill' ||
                 '21,28,master') }}
          INPUT_BENCHMARKS: ${{ inputs.benchmarks || '' }}
          # Pool selection. Push events force gha — pushes are smoke
          # tests, not paid runs. Schedule and dispatch take the
          # input (defaulting to gha when not provided).
          INPUT_RUNNER_POOL: >-
            ${{ github.event_name == 'push' && 'gha' ||
                (inputs.runner_pool || 'gha') }}
          # Needed for the per-target commit-timestamp lookup; the
          # default GHA token is fine since erlang/otp is public.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Resolve splits cleanly into two stages and the heavy lifting
        # lives in standalone scripts so it can be exercised without
        # GHA. See bin/expand-otp-refs.sh + bin/resolve-fill-needs.sh.
        run: |
          set -euo pipefail

          # Stage 1: turn `all`/`fill` (or shorthand like `21`, `22.3`)
          # into a flat comma-separated list of full OTP refs. Only
          # `fill` engages the fill-mode skip check; only `all` flags
          # the publish step to wipe gh-pages first.
          if [ "$INPUT_REFS" = "fill" ]; then
            FILL_MODE=1
          else
            FILL_MODE=0
          fi
          if [ "$INPUT_REFS" = "all" ]; then
            echo "wipe_gh_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "wipe_gh_pages=false" >> "$GITHUB_OUTPUT"
          fi
          EXPANDED="$(./bin/expand-otp-refs.sh "$INPUT_REFS")"
          echo "[resolve] expanded \"$INPUT_REFS\" → $EXPANDED"

          # Stage 2: resolve each ref to a SHA, probe gh-pages for
          # what's already published, and emit six per-(major,
          # platform) JSON arrays + has_* booleans into GITHUB_OUTPUT.
          FILL_MODE="$FILL_MODE" \
            INPUT_BENCHMARKS="$INPUT_BENCHMARKS" \
            ./bin/resolve-fill-needs.sh "$EXPANDED"

          echo "runner_pool=$INPUT_RUNNER_POOL" >> "$GITHUB_OUTPUT"
          echo "[resolve] runner_pool=$INPUT_RUNNER_POOL"

  # Build the per-target Linux benchmark image. Always runs on
  # GHA-hosted Linux (free public-repo Actions minutes) regardless
  # of `runner_pool` — image construction doesn't need bare-metal
  # hardware accuracy, and AWS measure jobs `docker pull` the same
  # tag from GHCR.
  build-linux:
    needs: resolve
    if: needs.resolve.outputs.has_modern_linux == 'true'
    permissions:
      contents: read
      packages: write   # push image to GHCR
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern_linux) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { name: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ matrix.target.sha }}
            OTP_REF=${{ matrix.target.ref }}
            ELIXIR_OTP_MAJOR=${{ matrix.target.elixir_bundle }}
            ELIXIR_VERSION=${{ matrix.target.elixir }}
          # Forwarded to fetch-otp-source.sh inside the build so it
          # can pull erlang/otp's `otp_prebuilt` CI artifact (prebuilt
          # beams + pre-run configure — saves several minutes per
          # cold build vs. /archive raw source).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          # Single tag scheme regardless of consumer pool: image
          # content is reproducible from OTP_SHA + Dockerfile +
          # patches, so a `gha`-pool push and an `aws`-pool dispatch
          # produce equivalent images for the same SHA. AWS measure
          # jobs pull the same tag.
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}
          cache-from: type=gha,scope=linux-${{ matrix.arch.name }}
          cache-to: type=gha,scope=linux-${{ matrix.arch.name }},mode=max

  # Same Dockerfile, same toolchain — pre-OTP-24 SHAs go through the
  # build-linux pipeline too. Phase 2 of
  # PLAN/TARGET_ELIXIR_RUNNER_PLAN.md: a single source-of-truth for
  # Linux OTP builds across modern + legacy. Two consumers:
  #   * prep-target-bundle: extracts /opt/otp from the resulting
  #     image and feeds bin/build-target-bundle.sh — no duplicate
  #     OTP source build.
  #   * measure-linux-target-v2: docker pull the image (GHA) or
  #     extract + bare-metal exec (AWS) — same dual-mode consumption
  #     as the modern measure-linux job.
  build-linux-target:
    needs: resolve
    if: needs.resolve.outputs.has_legacy_linux == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_linux) }}
        arch:
          - { name: x86_64, runner: ubuntu-latest,    platform: linux/amd64 }
          - { name: arm64,  runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.linux
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            OTP_SHA=${{ matrix.target.sha }}
            OTP_REF=${{ matrix.target.ref }}
            ELIXIR_OTP_MAJOR=${{ matrix.target.elixir_bundle }}
            ELIXIR_VERSION=${{ matrix.target.elixir }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}
          # Same gha cache scope as build-linux — modern and legacy
          # OTPs share most of the layer cache (toolchain, base
          # image, autotools), so they should warm each other.
          cache-from: type=gha,scope=linux-${{ matrix.arch.name }}
          cache-to: type=gha,scope=linux-${{ matrix.arch.name }},mode=max

  # Build the per-Elixir target-Elixir bundle. Always runs on GHA
  # ubuntu-latest regardless of `runner_pool` — bundle assembly
  # doesn't need bare-metal accuracy. Per PLAN decision #12, this
  # job consumes a pre-built OTP install dir (extracted from the
  # legacy build-linux-target image) rather than source-building
  # OTP itself. Eliminates the ~7-min duplicate build that an
  # independent source-build would impose.
  #
  # Matrix is a fixed 4 entries, one per pre-24 OTP major × pinned
  # Elixir. The `find_sha` step skips the entry if the resolve
  # output didn't include any SHA for that major (e.g. a smoke run
  # only covering OTP 21 leaves OTP 20/22/23 entries skipped). When
  # the run includes multiple SHAs for the same major, we pick the
  # first (any will do — Elixir BEAM bytecode is forward-compatible
  # within an OTP major).
  prep-target-bundle:
    needs: [resolve, build-linux-target]
    if: needs.resolve.outputs.has_legacy_linux == 'true'
    permissions:
      contents: read
      packages: read
      # `aws s3 cp` needs OIDC creds when runner_pool=aws. The step
      # is gated on the pool input but the permission has to be
      # declared up-front.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { otp_major: "20", elixir_version: "1.9.4" }
          - { otp_major: "21", elixir_version: "1.11.4" }
          - { otp_major: "22", elixir_version: "1.13.4" }
          - { otp_major: "23", elixir_version: "1.14.5" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find SHA for OTP ${{ matrix.otp_major }}
        id: find_sha
        env:
          TARGETS: ${{ needs.resolve.outputs.targets_legacy_linux }}
        run: |
          SHA="$(echo "$TARGETS" \
            | jq -r --arg M "${{ matrix.otp_major }}" \
                '[.[] | select(.major == $M)] | .[0].sha // empty')"
          if [ -z "$SHA" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "[prep] no OTP-${{ matrix.otp_major }} entry in this run, skipping"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "[prep] OTP ${{ matrix.otp_major }} → $SHA"
      - name: Cache target bundle
        if: steps.find_sha.outputs.skipped != 'true'
        id: bundle_cache
        uses: actions/cache@v4
        with:
          # Cache key: Elixir version + OTP SHA + sub-app + vendored
          # deps. Bumping the sub-app source or vendored Benchee
          # busts the cache; same OTP SHA + same Elixir + same
          # sources hits.
          path: target_bundle_${{ matrix.elixir_version }}.tar.gz
          key: target-bundle-${{ matrix.elixir_version }}-${{ steps.find_sha.outputs.sha }}-${{ hashFiles('apps/awfy_target_runner/**', 'bin/build-target-bundle.sh', 'bin/install-elixir-source.sh') }}
      - name: Login to GHCR
        if: steps.find_sha.outputs.skipped != 'true' && steps.bundle_cache.outputs.cache-hit != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract OTP from build-linux-target image
        if: steps.find_sha.outputs.skipped != 'true' && steps.bundle_cache.outputs.cache-hit != 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.find_sha.outputs.sha }}-x86_64"
          docker pull "$IMAGE"
          ./bin/extract-otp-from-image.sh "$IMAGE" "$PWD/otp"
      - name: Build target bundle
        if: steps.find_sha.outputs.skipped != 'true' && steps.bundle_cache.outputs.cache-hit != 'true'
        run: |
          ./bin/build-target-bundle.sh "$PWD/otp" "${{ matrix.elixir_version }}" \
            "target_bundle_${{ matrix.elixir_version }}.tar.gz"
      - name: Upload bundle artifact
        if: steps.find_sha.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: target-bundle-${{ matrix.elixir_version }}
          path: target_bundle_${{ matrix.elixir_version }}.tar.gz
          retention-days: 30
      # AWS bundle distribution: gated on runner_pool=aws so it's a
      # no-op while the default is gha (PLAN decision #3 — wired
      # now so flipping the default later is one-line). The bucket
      # name comes from a workflow var so the operator can rotate
      # buckets without touching the workflow.
      - name: Upload bundle to S3 (AWS pool only)
        if: steps.find_sha.outputs.skipped != 'true' && needs.resolve.outputs.runner_pool == 'aws' && vars.AWFY_TARGET_BUNDLE_S3_BUCKET != ''
        env:
          BUCKET: ${{ vars.AWFY_TARGET_BUNDLE_S3_BUCKET }}
        run: |
          aws s3 cp \
            "target_bundle_${{ matrix.elixir_version }}.tar.gz" \
            "s3://$BUCKET/target_bundle_${{ matrix.elixir_version }}.tar.gz"

  # Linux modern measurements. runs-on routes to GHA-hosted or AWS
  # self-hosted via the resolved runner_pool output. CPU pinning
  # (`--cpuset-cpus=0`) only fires on AWS — GHA runners share
  # tenancy and pinning there gives us nothing.
  measure-linux:
    needs: [resolve, build-linux]
    if: needs.resolve.outputs.has_modern_linux == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern_linux) }}
        arch:
          # gha_runner: GHA-hosted label per arch.
          # aws_label: self-hosted label registered by Terraform —
          # see terraform/README.md and SETUP.md § 2.
          - { name: x86_64, gha_runner: ubuntu-latest,    aws_label: awfy-bench-linux-x86_64 }
          - { name: arm64,  gha_runner: ubuntu-24.04-arm, aws_label: awfy-bench-linux-arm64 }
        flavor: [jit, emu]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON(format('["self-hosted","{0}"]', matrix.arch.aws_label)) || matrix.arch.gha_runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull benchmark image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}"
      - name: Preflight (advisory only — runners always WARN)
        run: |
          docker run --rm \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}" \
            awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS_VAL: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          # CPU pinning only matters on AWS — c6i hyperthread sibling
          # of vCPU 0 is vCPU 8 (left idle by the cpuset mask), giving
          # the physical core no contention. On Graviton 3 there's no
          # SMT, so cpuset=0 is one full physical core. GHA runners
          # share tenancy; pinning there is meaningless.
          CPU_PIN: ${{ needs.resolve.outputs.runner_pool == 'aws' && '--cpuset-cpus=0' || '' }}
        run: |
          mkdir -p "$PWD/results"
          # `--benchmarks` is optional: empty string from resolve →
          # full suite; comma list (Bounce,CD,…) → just those.
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          # shellcheck disable=SC2086 # CPU_PIN intentionally word-splits.
          docker run --rm \
            $CPU_PIN \
            -e ERL_FLAGS="$ERL_FLAGS_VAL" \
            -e AWFY_OTP_COMMIT_TIMESTAMP="$AWFY_OTP_COMMIT_TIMESTAMP" \
            -e AWFY_OTP_VERSION="$AWFY_OTP_VERSION" \
            -v "$PWD/results:/app/results" \
            "ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}" \
            awfy.measure \
              --label "${{ matrix.target.label }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
              --ignore-preflight \
              $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # Windows modern measurements. GHA windows-latest or AWS self-hosted
  # Windows pool. The wmic shim is only needed on GHA (recent
  # windows-latest images dropped WMIC); the AWS AMI is pinned to a
  # version where WMIC is still present.
  measure-windows:
    needs: resolve
    if: needs.resolve.outputs.has_modern_windows == 'true'
    permissions:
      contents: read
      actions: read   # `gh run download` against erlang/otp
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern_windows) }}
        # The upstream Windows installer ships JIT-only (no
        # beam.emu.dll). Measuring emu on Windows would require
        # building OTP from source on the runner (slow + fiddly on
        # Windows). Drop emu here; pick it back up if/when we have a
        # `make FLAVOR=emu` installer artifact to side-load.
        flavor: [jit]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON('["self-hosted","awfy-bench-windows"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install OTP
        id: install_otp
        shell: pwsh
        env:
          OTP_WIN_INSTALLER_URL: ${{ vars.OTP_WIN_INSTALLER_URL }}
          # windows_ref == ref for modern (OTP ≥ 24) targets — using
          # windows_ref keeps this step symmetric with
          # measure-windows-target, where the legacy function-release
          # mapping kicks in.
          OTP_REF: ${{ matrix.target.windows_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          if ([string]::IsNullOrWhiteSpace($prefix)) {
            # Script emitted skipped=true (no Windows installer for
            # this tag — see install-otp-windows.ps1 Fetch-FromTag).
            # Bail before adding bogus PATH entries; downstream steps
            # are gated on steps.install_otp.outputs.skipped != 'true'.
            exit 0
          }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Elixir
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          # Elixir 1.19 dropped OTP 26 — keep 1.18 for OTP 26 only.
          ELIXIR_VERSION: ${{ matrix.target.elixir }}
          ELIXIR_OTP_MAJOR: ${{ matrix.target.elixir_bundle }}
        run: |
          $url = "https://github.com/elixir-lang/elixir/releases/download/v$env:ELIXIR_VERSION/elixir-otp-$env:ELIXIR_OTP_MAJOR.zip"
          $zip = "$env:TEMP\elixir.zip"
          $dest = "$env:USERPROFILE\.local\elixir\$env:ELIXIR_VERSION"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install wmic shim (GHA only)
        if: needs.resolve.outputs.runner_pool != 'aws' && steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        # Benchee.System.{available_memory,cpu_speed}/1 shell out to
        # WMIC for system fingerprinting. Recent GHA windows-latest
        # images drop WMIC; Benchee then prints stack traces because
        # the Erlang port `spawn_executable` raises :enoent (or
        # :eacces if the target is a .cmd/.bat — Windows CreateProcess
        # can only run real .exe/.com binaries directly).
        #
        # Add-WindowsCapability fetches WMIC from Windows Update on
        # demand, which routinely runs 5+ minutes. Compile a tiny C#
        # stub into a real wmic.exe instead — covers the two queries
        # Benchee makes by dispatching to PowerShell's CIM.
        #
        # AWS Windows AMI is pinned to a version that still ships
        # WMIC, so the shim isn't needed there.
        run: |
          $shimDir = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null

          $cs = @'
          using System;
          using System.Diagnostics;
          class Wmic {
              static int Main(string[] args) {
                  string ps = null;
                  if (args.Length >= 3
                      && string.Equals(args[0], "COMPUTERSYSTEM", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "TOTALPHYSICALMEMORY", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output TotalPhysicalMemory; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory";
                  } else if (args.Length >= 3
                      && string.Equals(args[0], "CPU", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "NAME", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output Name; (Get-CimInstance Win32_Processor).Name";
                  } else {
                      return 1;
                  }
                  var psi = new ProcessStartInfo("powershell",
                      "-NoProfile -Command \"" + ps + "\"");
                  psi.UseShellExecute = false;
                  var p = Process.Start(psi);
                  p.WaitForExit();
                  return p.ExitCode;
              }
          }
          '@
          $csPath = Join-Path $env:TEMP "wmic.cs"
          $cs | Set-Content -Path $csPath -Encoding UTF8
          # .NET Framework 4 csc.exe lives at this fixed path on every
          # modern Windows install; doesn't need vcvars or VS env setup.
          $csc = "${env:WINDIR}\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:"$shimDir\wmic.exe" $csPath
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "wmic.exe shim at $shimDir\wmic.exe"
      - name: Compile awfy
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — runners always WARN)
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        run: mix awfy.preflight || $true
      - name: Measure (${{ matrix.flavor }})
        if: steps.install_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          RUNNER_POOL: ${{ needs.resolve.outputs.runner_pool }}
        run: |
          # CPU pinning on AWS only: pin the PowerShell process (and
          # its children: mix, erl, peer) to logical processor 0 —
          # bitmask 0x1. On c6i.4xlarge vCPU 0's hyperthread sibling
          # is vCPU 8 (not in the mask), so the physical core has no
          # other work scheduled on it. GHA runners share tenancy;
          # pinning there is meaningless.
          if ($env:RUNNER_POOL -eq 'aws') {
            [System.Diagnostics.Process]::GetCurrentProcess().ProcessorAffinity = [IntPtr]1
          }
          $args = @(
            "--label", "${{ matrix.target.label }}-windows-x86_64-${{ matrix.flavor }}",
            "--ignore-preflight"
          )
          if ($env:BENCHMARKS) { $args += @("--benchmarks", $env:BENCHMARKS) }
          mix awfy.measure @args
      - if: steps.install_otp.outputs.skipped != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # macOS modern measurements. Always runs on GHA-hosted macos-latest
  # — there is no AWS macOS pool in scope (operator's M5 covers
  # local-fill via `mix awfy.fill`; see SETUP.md § 3). Independent
  # of `runner_pool`.
  measure-macos:
    needs: resolve
    if: needs.resolve.outputs.has_modern_macos == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_modern_macos) }}
        flavor: [jit, emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps
        run: brew install autoconf openssl@3 ncurses
      - name: Cache OTP build
        uses: actions/cache@v4
        with:
          # install-otp-source.sh content-addresses by SHA, so the
          # cache key is exact. Hits skip the 5-10 min source build
          # entirely; the script's own OTP_INSTALLED guard then just
          # recompiles the small target-beam tree. Same scheme as the
          # measure-linux-target leg below.
          #
          # The hashFiles segment busts the cache whenever any file
          # that materially affects the cached prefix changes:
          #
          #   * bin/install-otp-source.sh   — configure flags, build
          #     command, target-beam compile.
          #   * bin/fetch-otp-source.sh     — source resolution
          #     (release tarball / prebuilt artifact / archive).
          #   * patches/**                  — per-major OTP patches
          #     applied before configure.
          #   * .github/workflows/bench.yml — configure-flag env
          #     (AWFY_OTP_EXTRA_CONFIGURE, CFLAGS) is composed here;
          #     coarse but correct.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-macos-arm64-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench.yml') }}
      - name: Build OTP from source
        id: otp
        env:
          OTP_REF: ${{ matrix.target.ref }}
          # Per-ref extra configure flags computed in the resolve step —
          # currently `--without-ssl` for OTP versions whose crypto NIF
          # references APIs OpenSSL 3 removed (FIPS_mode etc.). Empty
          # for everything else; we then default to wiring up Homebrew's
          # keg-only openssl@3 so configure doesn't silently build
          # without crypto (which makes mix refuse to start with
          # "application crypto could not be found").
          #
          # GH_TOKEN: install-otp-source.sh may pull the `otp_prebuilt`
          # artifact from upstream's Build workflow for branch refs
          # (master). That download requires actions:read on erlang/otp;
          # the default GHA token works since erlang/otp is public.
          EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$EXTRA_CONFIGURE" ]; then
              export AWFY_OTP_EXTRA_CONFIGURE="$EXTRA_CONFIGURE"
          else
              export AWFY_OTP_EXTRA_CONFIGURE="--with-ssl=$(brew --prefix openssl@3)"
          fi
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - name: Install Elixir
        # `brew install elixir` always pulls latest (1.19) which dropped
        # OTP 26. Use the precompiled bundle so we can pick the right
        # release per target.
        env:
          ELIXIR_VERSION: ${{ matrix.target.elixir }}
          ELIXIR_OTP_MAJOR: ${{ matrix.target.elixir_bundle }}
        run: |
          dest="$HOME/.local/elixir/$ELIXIR_VERSION"
          mkdir -p "$dest"
          url="https://github.com/elixir-lang/elixir/releases/download/v$ELIXIR_VERSION/elixir-otp-$ELIXIR_OTP_MAJOR.zip"
          curl -fL "$url" -o /tmp/elixir.zip
          unzip -q /tmp/elixir.zip -d "$dest"
          echo "$dest/bin" >> "$GITHUB_PATH"
      - name: Compile awfy
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Preflight (advisory only — runners always WARN)
        run: mix awfy.preflight || true
      - name: Measure (${{ matrix.flavor }})
        env:
          ERL_FLAGS: ${{ matrix.flavor == 'emu' && '-emu_flavor emu' || '' }}
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
        run: |
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          mix awfy.measure \
            --label "${{ matrix.target.label }}-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight \
            $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------
  # Target-runner path for OTP < 24 (no compatible Elixir bundle).
  # The host orchestrator runs on a pinned modern OTP/Elixir; the
  # target VM is built from source on the runner via
  # bin/install-otp-source.sh and shelled out to per benchmark.
  #
  # Both x86_64 and arm64 supported (same install-otp-source.sh, same
  # patches). OTP 20-23 only run the `emu` flavor — the JIT didn't
  # exist yet, and HiPE-as-jit-equivalent (compiling sources with
  # `+native`) isn't wired through the harness. See patches/README.md.
  # ---------------------------------------------------------------
  measure-linux-target:
    needs: resolve
    if: needs.resolve.outputs.has_legacy_linux == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_linux) }}
        arch:
          - { name: x86_64, gha_runner: ubuntu-latest,    aws_label: awfy-bench-linux-x86_64 }
          - { name: arm64,  gha_runner: ubuntu-24.04-arm, aws_label: awfy-bench-linux-arm64 }
        flavor: [emu]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON(format('["self-hosted","{0}"]', matrix.arch.aws_label)) || matrix.arch.gha_runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps for target OTP
        # ubuntu-latest's image has build-essential preinstalled; we
        # only need to top up the OTP-specific dev packages. OpenSSL 3
        # is what ships on Ubuntu 24.04 — OTP < 23's crypto NIF won't
        # compile against it without patches. That's the expected v1
        # state: builds fail per major until a patch lands under
        # patches/OTP-<major>/. See patches/README.md.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf m4 \
            libssl-dev libncurses-dev zlib1g-dev \
            ca-certificates curl patch
      - name: Cache target OTP build
        id: otp-cache
        uses: actions/cache@v4
        with:
          # install-otp-source.sh content-addresses by SHA, so the
          # cache key is exact. Hits skip the 5-10 min source build.
          # See the measure-macos cache block above for the full
          # rationale on the hashFiles segment.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-target-linux-${{ matrix.arch.name }}-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench.yml') }}
      - name: Build target OTP
        env:
          # Pass the ref name (e.g. OTP-20.3), not the SHA — install-otp-source.sh's
          # prebuilt-source URL probe matches on `OTP-*` so it can hit the
          # github-release / erlang.org tarball with prebuilt beams.
          # Passing only the SHA bypasses that path and falls through to
          # /archive/<sha>.tar.gz, which lacks config.guess on older OTPs.
          OTP_REF: ${{ matrix.target.ref }}
          # Empty for OTP ≥ 24 (crypto compiles fine against OpenSSL 3
          # so the suite can use it); `--without-ssl` for OTP < 24
          # whose crypto NIF needs OpenSSL 1.1. Computed in resolve.
          AWFY_OTP_EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          # GCC 10+ defaults to `-fno-common`, which breaks the OTP 20
          # link step (`multiple definition of erts_allctr_wrappers` in
          # erts/emulator/beam/erl_alloc.h). `-fcommon` restores the
          # older behaviour and is harmless on newer OTPs that don't
          # trigger the conflict.
          #
          # OTP's configure REPLACES (not appends) when CFLAGS env is
          # set, and refuses to run unless -O is present. So we have
          # to bake in the defaults (-O2 -g) ourselves.
          CFLAGS: -O2 -g -fcommon
          # Same prebuilt-artifact caveat as the macOS build step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "AWFY_TARGET_ERL=$PREFIX/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PREFIX/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          # Pinned modern host. The orchestrator never touches the
          # target erl directly — only via TargetRunner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }})
        # AWFY_TARGET_ERL / AWFY_TARGET_BEAMS were exported via
        # GITHUB_ENV in the build step. Setting them here would
        # re-export the literal strings (with un-expanded `~`), so we
        # rely on the env file inheritance instead.
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          # CPU pinning on AWS only: taskset -c 0 wraps the mix
          # invocation. Children (peer, target erl) inherit the
          # affinity mask. Same hyperthread-sibling reasoning as
          # measure-linux.
          CPU_PIN: ${{ needs.resolve.outputs.runner_pool == 'aws' && 'taskset -c 0' || '' }}
        run: |
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          # shellcheck disable=SC2086 # CPU_PIN intentionally word-splits.
          $CPU_PIN mix awfy.measure \
            --label "${{ matrix.target.label }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
            --ignore-preflight \
            $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # Target-runner path for OTP < 24 on Windows. Mirrors
  # measure-linux-target: a pinned modern host runs the orchestrator,
  # shells out per-benchmark to a target erl from the upstream
  # Windows installer for matrix.target.windows_ref (function release
  # — patch installers don't exist for OTP < 24 on Windows).
  measure-windows-target:
    needs: resolve
    if: needs.resolve.outputs.has_legacy_windows == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_windows) }}
        flavor: [emu]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON('["self-hosted","awfy-bench-windows"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target OTP
        id: install_target_otp
        shell: pwsh
        env:
          OTP_REF: ${{ matrix.target.windows_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          if ([string]::IsNullOrWhiteSpace($prefix)) {
            # No installer for this ref (script set skipped=true and exit 0).
            exit 0
          }
          # Don't add the target's bin to PATH — that's the host's job.
          # Just expose the absolute paths through GITHUB_ENV so the
          # next step can compile target beams and the measure step
          # can shell out via TargetRunner.
          "AWFY_TARGET_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWFY_TARGET_ERL=$prefix\bin\erl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile target beams
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        # Target erlc compiles awfy benchmark sources into a
        # $PREFIX/awfy_target/awfy-0.1.0/{ebin,priv} layout that
        # mirrors install-otp-source.sh's Linux/macOS step. .beam
        # format isn't reliably forward-compatible across major OTPs,
        # so we have to use the target's own erlc, not the host's.
        # awfy_benchmark must be compiled first (the other modules
        # `-behaviour(awfy_benchmark)`, and a missing behaviour spec
        # silently falls back to "behaviour undefined" warnings).
        #
        # Resolve all sources to absolute paths up front. Earlier
        # iterations relied on PowerShell line-continuation backticks
        # plus `Get-ChildItem` and quietly produced an empty pass-2
        # source list — `awfy_target_runner.beam` never landed in
        # ebin and the timing pass blew up with `undef
        # awfy_target_runner:run_iters_io/3`. Switching to explicit
        # `Resolve-Path` calls + a post-compile listing makes that
        # class of failure loud.
        run: |
          $prefix = $env:AWFY_TARGET_PREFIX
          $erlc = Join-Path $prefix "bin\erlc.exe"
          $targetLib = Join-Path $prefix "awfy_target\awfy-0.1.0"
          $ebin = Join-Path $targetLib "ebin"
          New-Item -ItemType Directory -Force -Path $ebin | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $targetLib "priv") | Out-Null

          $srcDir = (Resolve-Path "apps/awfy/src").Path
          $srcTargetDir = (Resolve-Path "apps/awfy/src_target").Path
          $bootstrap = @("awfy_benchmark.erl", "awfy_random.erl", "awfy_som_vector.erl") |
                       ForEach-Object { Join-Path $srcDir $_ }
          $allSrcs = @(Get-ChildItem -Path $srcDir -Filter *.erl).FullName +
                     @(Get-ChildItem -Path $srcTargetDir -Filter *.erl).FullName
          Write-Host "pass 1: $($bootstrap.Count) bootstrap sources"
          Write-Host "pass 2: $($allSrcs.Count) total sources"

          & $erlc -o $ebin @bootstrap
          if ($LASTEXITCODE -ne 0) { throw "target erlc (pass 1) failed: $LASTEXITCODE" }

          & $erlc -pa $ebin -o $ebin @allSrcs
          if ($LASTEXITCODE -ne 0) { throw "target erlc (pass 2) failed: $LASTEXITCODE" }

          $beams = Get-ChildItem -Path $ebin -Filter *.beam
          Write-Host "compiled $($beams.Count) beams into $ebin"
          $beams | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not ($beams.Name -contains "awfy_target_runner.beam")) {
            throw "awfy_target_runner.beam missing from $ebin after compile"
          }

          if (Test-Path apps/awfy/priv) {
            Copy-Item -Recurse -Force apps/awfy/priv\* (Join-Path $targetLib "priv\")
          }
          "AWFY_TARGET_BEAMS=$ebin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: erlef/setup-beam@v1
        if: steps.install_target_otp.outputs.skipped != 'true'
        with:
          # Pinned modern host. The orchestrator never touches the
          # target erl directly — only via TargetRunner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Install wmic shim (GHA only)
        if: needs.resolve.outputs.runner_pool != 'aws' && steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        # See measure-windows for the full rationale; same shim, same
        # csc.exe path. Without it Benchee's system-info probes raise
        # :enoent and pollute the run with stack traces.
        run: |
          $shimDir = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          $cs = @'
          using System;
          using System.Diagnostics;
          class Wmic {
              static int Main(string[] args) {
                  string ps = null;
                  if (args.Length >= 3
                      && string.Equals(args[0], "COMPUTERSYSTEM", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "TOTALPHYSICALMEMORY", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output TotalPhysicalMemory; (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory";
                  } else if (args.Length >= 3
                      && string.Equals(args[0], "CPU", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[1], "GET", StringComparison.OrdinalIgnoreCase)
                      && string.Equals(args[2], "NAME", StringComparison.OrdinalIgnoreCase)) {
                      ps = "Write-Output Name; (Get-CimInstance Win32_Processor).Name";
                  } else {
                      return 1;
                  }
                  var psi = new ProcessStartInfo("powershell",
                      "-NoProfile -Command \"" + ps + "\"");
                  psi.UseShellExecute = false;
                  var p = Process.Start(psi);
                  p.WaitForExit();
                  return p.ExitCode;
              }
          }
          '@
          $csPath = Join-Path $env:TEMP "wmic.cs"
          $cs | Set-Content -Path $csPath -Encoding UTF8
          $csc = "${env:WINDIR}\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:"$shimDir\wmic.exe" $csPath
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile orchestrator
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }})
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          # windows_otp_label, not otp_label — the upstream Windows
          # installer for OTP < 24 only ships the function release
          # (e.g. 21.0), so claiming "21.0.9" here would mislabel the
          # dashboard. See windows_otp_label derivation in resolve.
          AWFY_OTP_VERSION: ${{ matrix.target.windows_otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          RUNNER_POOL: ${{ needs.resolve.outputs.runner_pool }}
        run: |
          if ($env:RUNNER_POOL -eq 'aws') {
            [System.Diagnostics.Process]::GetCurrentProcess().ProcessorAffinity = [IntPtr]1
          }
          $args = @(
            "--label", "${{ matrix.target.label }}-windows-x86_64-${{ matrix.flavor }}",
            "--ignore-preflight"
          )
          if ($env:BENCHMARKS) { $args += @("--benchmarks", $env:BENCHMARKS) }
          mix awfy.measure @args
      - uses: actions/upload-artifact@v7
        if: steps.install_target_otp.outputs.skipped != 'true'
        with:
          name: results-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # Target-runner path for OTP < 24 on macOS arm64. Always GHA-hosted
  # macos-latest (no AWS macOS pool in scope). Mirrors
  # measure-linux-target: pinned modern host runs the orchestrator,
  # shells out per-benchmark to a target erl built from source via
  # bin/install-otp-source.sh. macOS arm64 builds for OTP 20-23
  # require the patches/OTP-<major>/ stack — see patches/README.md.
  # Single emu flavor (BEAM JIT didn't exist yet, HiPE-as-jit isn't
  # wired through the harness).
  measure-macos-target:
    needs: resolve
    if: needs.resolve.outputs.has_legacy_macos == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_macos) }}
        flavor: [emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build deps for target OTP
        # ncurses keg-only on macOS — install-otp-source.sh's configure
        # finds it via brew --prefix when set in CFLAGS/LDFLAGS, but
        # we don't need that explicit wiring for OTP < 24 (the
        # patches/OTP-<major>/ stack already covers the macOS-specific
        # build issues for these majors). openssl@3 isn't pulled here
        # because we configure target OTP with --without-ssl below.
        run: brew install autoconf ncurses
      - name: Cache target OTP build
        id: otp-cache
        uses: actions/cache@v4
        with:
          # Same content-addressed cache scheme as measure-linux-target
          # / measure-macos. See measure-macos for the full hashFiles
          # rationale.
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-target-macos-arm64-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench.yml') }}
      - name: Build target OTP
        env:
          OTP_REF: ${{ matrix.target.ref }}
          # Same OpenSSL-3-incompat reasoning as measure-linux-target:
          # OTP < 24 crypto NIF needs APIs OpenSSL 3 removed. Resolve
          # picks `--without-ssl` for those refs.
          AWFY_OTP_EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          # GCC/clang-15+ defaults to `-fno-common`, which breaks the
          # OTP 20 link step. -fcommon restores the older behaviour
          # and is harmless on newer OTPs. Same as the linux-target
          # leg.
          CFLAGS: -O2 -g -fcommon
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="$(./bin/install-otp-source.sh "$OTP_REF")"
          echo "AWFY_TARGET_ERL=$PREFIX/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PREFIX/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          # Pinned modern host. The orchestrator never touches the
          # target erl directly — only via TargetRunner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }})
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
        run: |
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          mix awfy.measure \
            --label "${{ matrix.target.label }}-macos-arm64-${{ matrix.flavor }}" \
            --ignore-preflight \
            $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.target.short }}-macos-arm64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  # ---------------------------------------------------------------
  # Phase-2 parallel `-target-v2` measure jobs. Run alongside the
  # legacy `-target` jobs (which they don't replace until Phase 3
  # of PLAN/TARGET_ELIXIR_RUNNER_PLAN.md). Both paths produce
  # `.benchee` files for the same OTP refs into separate run-dirs
  # so `bin/compare-target-paths.sh` can validate parity.
  #
  # Common shape per platform:
  #   1. Acquire target OTP (docker pull on Linux, install-otp-* on
  #      macOS/Windows — same as the legacy -target jobs).
  #   2. Download the matching target_bundle_<version>.tar.gz from
  #      prep-target-bundle (always via actions/download-artifact —
  #      no S3 fallback in v1; AWS fetches the same artifact).
  #   3. Extract the bundle, set AWFY_TARGET_ERL / AWFY_TARGET_BUNDLE
  #      / AWFY_TARGET_BEAMS, invoke `mix awfy.measure --runner=bundle`.
  #   4. Upload results into a `*-v2` artifact name so the legacy
  #      and bundle paths don't clobber each other on staging.
  # ---------------------------------------------------------------
  measure-linux-target-v2:
    needs: [resolve, build-linux-target, prep-target-bundle]
    if: needs.resolve.outputs.has_legacy_linux == 'true'
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_linux) }}
        arch:
          - { name: x86_64, gha_runner: ubuntu-latest,    aws_label: awfy-bench-linux-x86_64 }
          - { name: arm64,  gha_runner: ubuntu-24.04-arm, aws_label: awfy-bench-linux-arm64 }
        flavor: [emu]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON(format('["self-hosted","{0}"]', matrix.arch.aws_label)) || matrix.arch.gha_runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pick Elixir version for OTP ${{ matrix.target.major }}
        id: elixir
        # Same pinned matrix as prep-target-bundle. Hardcoded here
        # rather than threaded through resolve to keep the Phase 2
        # surgery contained.
        run: |
          case "${{ matrix.target.major }}" in
            20) echo "version=1.9.4"  >> "$GITHUB_OUTPUT" ;;
            21) echo "version=1.11.4" >> "$GITHUB_OUTPUT" ;;
            22) echo "version=1.13.4" >> "$GITHUB_OUTPUT" ;;
            23) echo "version=1.14.5" >> "$GITHUB_OUTPUT" ;;
            *)  echo "::error::no Elixir pin for OTP ${{ matrix.target.major }}"; exit 1 ;;
          esac
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract OTP from per-OTP-SHA image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ matrix.target.sha }}-${{ matrix.arch.name }}"
          docker pull "$IMAGE"
          ./bin/extract-otp-from-image.sh "$IMAGE" "$PWD/otp"
          echo "AWFY_TARGET_ERL=$PWD/otp/bin/erl" >> "$GITHUB_ENV"
          echo "AWFY_TARGET_BEAMS=$PWD/otp/awfy_target/awfy-0.1.0/ebin" >> "$GITHUB_ENV"
      - name: Download target bundle
        uses: actions/download-artifact@v8
        with:
          name: target-bundle-${{ steps.elixir.outputs.version }}
          path: bundle-tar/
      - name: Extract bundle
        run: |
          mkdir -p bundle
          tar xzf "bundle-tar/target_bundle_${{ steps.elixir.outputs.version }}.tar.gz" -C bundle --strip-components=1
          echo "AWFY_TARGET_BUNDLE=$PWD/bundle" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        with:
          # Pinned modern host. The orchestrator never touches the
          # target erl directly — only via Awfy.Runner shell-out.
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }}, --runner=bundle)
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          CPU_PIN: ${{ needs.resolve.outputs.runner_pool == 'aws' && 'taskset -c 0' || '' }}
        run: |
          BENCH_ARG=""
          if [ -n "$BENCHMARKS" ]; then
            BENCH_ARG="--benchmarks $BENCHMARKS"
          fi
          # shellcheck disable=SC2086 # CPU_PIN intentionally word-splits.
          $CPU_PIN mix awfy.measure \
            --runner=bundle \
            --label "${{ matrix.target.label }}-v2-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}" \
            --ignore-preflight \
            $BENCH_ARG
      - uses: actions/upload-artifact@v7
        with:
          name: results-v2-${{ matrix.target.short }}-linux-${{ matrix.arch.name }}-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  measure-windows-target-v2:
    needs: [resolve, prep-target-bundle]
    if: needs.resolve.outputs.has_legacy_windows == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_windows) }}
        flavor: [emu]
    runs-on: ${{ needs.resolve.outputs.runner_pool == 'aws' && fromJSON('["self-hosted","awfy-bench-windows"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pick Elixir version for OTP ${{ matrix.target.major }}
        id: elixir
        shell: pwsh
        run: |
          $version = switch ("${{ matrix.target.major }}") {
            "20" { "1.9.4"  }
            "21" { "1.11.4" }
            "22" { "1.13.4" }
            "23" { "1.14.5" }
            default { Write-Error "no Elixir pin for OTP ${{ matrix.target.major }}"; exit 1 }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install target OTP
        id: install_target_otp
        shell: pwsh
        env:
          OTP_REF: ${{ matrix.target.windows_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefix = ./bin/install-otp-windows.ps1 -OtpRef $env:OTP_REF
          if ([string]::IsNullOrWhiteSpace($prefix)) {
            exit 0
          }
          "AWFY_TARGET_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWFY_TARGET_ERL=$prefix\bin\erl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download target bundle
        if: steps.install_target_otp.outputs.skipped != 'true'
        uses: actions/download-artifact@v8
        with:
          name: target-bundle-${{ steps.elixir.outputs.version }}
          path: bundle-tar
      - name: Extract bundle
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        run: |
          $tar = "bundle-tar\target_bundle_${{ steps.elixir.outputs.version }}.tar.gz"
          New-Item -ItemType Directory -Force -Path bundle-stage | Out-Null
          # tar.exe ships in modern Windows; --strip-components flattens
          # `bundle/` so the bundle dir we point AWFY_TARGET_BUNDLE at is
          # the top-level we extracted into.
          tar -xzf $tar -C bundle-stage --strip-components 1
          $bundle = (Resolve-Path bundle-stage).Path
          "AWFY_TARGET_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: erlef/setup-beam@v1
        if: steps.install_target_otp.outputs.skipped != 'true'
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - name: Compile orchestrator
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile
      - name: Measure (target ${{ matrix.target.major }}, ${{ matrix.flavor }}, --runner=bundle)
        if: steps.install_target_otp.outputs.skipped != 'true'
        shell: pwsh
        env:
          AWFY_OTP_COMMIT_TIMESTAMP: ${{ matrix.target.commit_timestamp }}
          AWFY_OTP_VERSION: ${{ matrix.target.windows_otp_label }}
          BENCHMARKS: ${{ needs.resolve.outputs.benchmarks }}
          RUNNER_POOL: ${{ needs.resolve.outputs.runner_pool }}
        run: |
          if ($env:RUNNER_POOL -eq 'aws') {
            [System.Diagnostics.Process]::GetCurrentProcess().ProcessorAffinity = [IntPtr]1
          }
          $args = @(
            "--runner=bundle",
            "--label", "${{ matrix.target.label }}-v2-windows-x86_64-${{ matrix.flavor }}",
            "--ignore-preflight"
          )
          if ($env:BENCHMARKS) { $args += @("--benchmarks", $env:BENCHMARKS) }
          mix awfy.measure @args
      - uses: actions/upload-artifact@v7
        if: steps.install_target_otp.outputs.skipped != 'true'
        with:
          name: results-v2-${{ matrix.target.short }}-windows-x86_64-${{ matrix.flavor }}
          path: results/
          retention-days: 30

  measure-macos-target-v2:
    needs: [resolve, prep-target-bundle]
    if: needs.resolve.outputs.has_legacy_macos == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets_legacy_macos) }}
        flavor: [emu]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pick Elixir version for OTP ${{ matrix.target.major }}
        id: elixir
        run: |
          case "${{ matrix.target.major }}" in
            20) echo "version=1.9.4"  >> "$GITHUB_OUTPUT" ;;
            21) echo "version=1.11.4" >> "$GITHUB_OUTPUT" ;;
            22) echo "version=1.13.4" >> "$GITHUB_OUTPUT" ;;
            23) echo "version=1.14.5" >> "$GITHUB_OUTPUT" ;;
            *)  echo "::error::no Elixir pin for OTP ${{ matrix.target.major }}"; exit 1 ;;
          esac
      - name: Install build deps for target OTP
        run: brew install autoconf ncurses
      - name: Cache target OTP build
        uses: actions/cache@v4
        with:
          path: ~/.local/otp/${{ matrix.target.sha }}
          key: otp-target-macos-arm64-${{ matrix.target.sha }}-${{ hashFiles('bin/install-otp-source.sh', 'bin/fetch-otp-source.sh', 'patches/**', '.github/workflows/bench.yml') }}
      - name: Build target OTP
        env:
          OTP_REF: ${{ matrix.target.ref }}
          AWFY_OTP_EXTRA_CONFIGURE: ${{ matrix.target.extra_configure }}
          CFLAGS: -O2 -g -fcommon
