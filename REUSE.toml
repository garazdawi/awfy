version = 1
SPDX-PackageName = "awfy"
SPDX-PackageSupplier = "Lukas Backström <lukas@erlang.org>"

# Rule (LICENSING_POLICY.md): every file carries its own inline SPDX
# header so copies preserve the licence. Bulk annotations here are
# reserved for files that *cannot* take a comment. Keep this list
# tight — a new entry should answer "what comment syntax does this
# file have?" with "none" before it lands here.

# mix.lock — generated by `mix deps.get`; the file is a single
# Elixir map that mix rewrites wholesale, so a leading comment
# wouldn't survive the next dependency change. CC0 ("no rights
# reserved") rather than Apache-2.0 because the file is purely
# derived metadata, not authored source.
[[annotations]]
path = "mix.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Embedded test data for the Json benchmark, copied from the
# upstream AWFY repo (Stefan Marr, MIT — see LICENSING_POLICY.md).
# JSON has no comment syntax, so the SPDX info has to live here.
[[annotations]]
path = "apps/awfy/priv/rap_benchmark.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Stefan Marr"
SPDX-License-Identifier = "MIT"

# JSON config for the JS/CSS linters that run against
# priv/dashboard.{js,css}. JSON has no comment syntax, so SPDX has
# to live here. package-lock.json is generated by `npm install`.
[[annotations]]
path = ["package.json", "package-lock.json", ".stylelintrc.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lukas Backström <lukas@erlang.org>"
SPDX-License-Identifier = "Apache-2.0"
