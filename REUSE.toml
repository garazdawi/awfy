version = 1
SPDX-PackageName = "awfy"
SPDX-PackageSupplier = "Lukas Backström <lukas@erlang.org>"

# Documentation, plan/policy markdown — covered in bulk so we don't
# need HTML-comment SPDX headers in every prose file.
[[annotations]]
path = ["*.md", "**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lukas Backström <lukas@erlang.org>"
SPDX-License-Identifier = "Apache-2.0"

# Repo metadata (gitignore, gitmodules, tool-versions, gitattributes)
# — same.
[[annotations]]
path = [".gitignore", ".gitmodules", ".tool-versions", ".gitattributes"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lukas Backström <lukas@erlang.org>"
SPDX-License-Identifier = "Apache-2.0"

# Mix's lockfile is generated; CC0-1.0 marks it as "no rights
# reserved" without polluting the source-license picture.
[[annotations]]
path = "mix.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Embedded test data for the Json benchmark, copied from the
# upstream AWFY repo (Stefan Marr, MIT — see LICENSING_POLICY.md).
[[annotations]]
path = "apps/awfy/priv/rap_benchmark.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "Stefan Marr"
SPDX-License-Identifier = "MIT"

# OTP build patches: a prose header explaining the failure and an
# inline unified diff against erlang/otp source. The diff content
# follows OTP's Apache-2.0 licence and the prose was written here,
# so Apache-2.0 covers both. Bulk annotation avoids needing
# `# SPDX-…` lines on every patch (which would also confuse some
# `patch` implementations that get strict about leading `#` outside
# the diff body).
[[annotations]]
path = "patches/OTP-*/*.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lukas Backström <lukas@erlang.org>"
SPDX-License-Identifier = "Apache-2.0"
